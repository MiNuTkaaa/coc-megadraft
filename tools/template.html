<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Megadraft Board</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Rubik:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: lobby (create / join with Town Hall filter) -> room: status bar, two rosters, shared pool grid, sticky lock-in bar. */
:root {
  /* Navy album ground: tokens for text and controls sitting directly on the navy. Cards reset them (see .card-ctx below). */
  --bg: rgba(255,255,255,.08); --panel: #f4f6ff; --panel2: rgba(255,255,255,.1); --fg: #ffffff; --muted: #aab6f0;
  --line: rgba(255,255,255,.16); --accent: #ffc928; --accent-sh: #b88a00; --accent-fg: #0f1840; --sel: #ffc928;
  --a: #ffc928; --a-line: #ffc928; --a-soft: rgba(255,201,40,.16); --b: #ff8a78; --b-line: #ff6a55; --b-soft: rgba(255,106,85,.18);
  --ok: #6ee7a8; --warn: #ffc928; --bad: #ff8a78;
  --display: "Bowlby One", system-ui, sans-serif;
  --body: "Rubik", system-ui, -apple-system, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box }
[hidden] { display: none !important }
body { line-height: 1.45 }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px 110px }
header.top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px }
header.top h1 { font-family: var(--display); font-weight: 800; font-size: 22px; margin: 0; letter-spacing: -.01em }
header.top h1 a { color: inherit; text-decoration: none }
.mode { font-size: 12px; padding: 3px 8px; border-radius: 99px; background: var(--panel2); color: var(--muted) }
.mode.live { color: var(--ok) }
.spacer { flex: 1 }
h2 { font-family: var(--display); font-weight: 600; font-size: 18px; margin: 0 0 10px; text-wrap: balance }
h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 8px; font-weight: 600 }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px }
@media (max-width: 720px) { .grid2 { grid-template-columns: 1fr } }
.stack { display: flex; flex-direction: column; gap: 12px }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap }
button, .btn { font: inherit; font-weight: 600; border: 1px solid var(--line); background: var(--panel2); color: var(--fg); padding: 8px 12px; border-radius: 8px; cursor: pointer; text-decoration: none; display: inline-block }
button:hover, .btn:hover { border-color: var(--muted) }
.primary { background: var(--accent) !important; border-color: var(--accent) !important; color: var(--accent-fg) !important }
button.danger { color: var(--bad) }
button:disabled { opacity: .45; cursor: not-allowed }
button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
input, select { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 7px 9px; min-width: 0 }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); min-width: 0 }
.muted { color: var(--muted) } .small { font-size: 12px }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums }
.list { display: flex; flex-direction: column; gap: 6px }
.mrow { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: inherit; flex-wrap: wrap; text-decoration: none }
.mrow:hover { border-color: var(--muted) }
.pill { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: var(--panel2); color: var(--muted); text-transform: uppercase; letter-spacing: .05em; white-space: nowrap }
.pill.lobby { color: var(--ok) } .pill.draft { color: var(--accent) } .pill.attack { color: var(--warn) }
.th { font-family: var(--mono); font-size: 12px; font-weight: 500; padding: 2px 7px; border-radius: 6px; background: var(--fg); color: var(--bg); white-space: nowrap }
.seatA { color: var(--a) } .seatB { color: var(--b) }
.hero { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 18px }
@media (max-width: 560px) { .hero { grid-template-columns: 1fr } }
.bigbtn { display: flex; flex-direction: column; gap: 4px; padding: 18px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); text-decoration: none }
.bigbtn b { font-family: var(--display); font-size: 22px; font-weight: 800 }
.bigbtn:hover { border-color: var(--accent) }
.bigbtn.go { background: var(--accent); border-color: var(--accent); color: var(--accent-fg) }
.bigbtn.go .muted { color: inherit; opacity: .85 }
.chips { display: flex; gap: 6px; flex-wrap: wrap }
.chips button { padding: 5px 10px; font-size: 13px }
.chips button.on { background: var(--fg); color: var(--bg); border-color: var(--fg) }
.status { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 12px 14px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); margin-bottom: 12px }
.status.turnA { border-color: var(--a); box-shadow: inset 4px 0 0 var(--a) }
.status.turnB { border-color: var(--b); box-shadow: inset 4px 0 0 var(--b) }
.status .who { font-family: var(--display); font-size: 20px; font-weight: 800 }
.clock { font-family: var(--mono); font-size: 22px; font-variant-numeric: tabular-nums }
.clock.low { color: var(--bad) }
.steps { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px }
.steps span { font-size: 12px; padding: 4px 10px; border-radius: 99px; background: var(--panel2); color: var(--muted) }
.steps span.on { background: var(--accent); color: var(--accent-fg) }
.roster { border-top: 3px solid var(--a) } .roster.B { border-top-color: var(--b) }
.roster .head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-bottom: 8px }
.roster .name { font-family: var(--display); font-weight: 800; font-size: 18px }
.cat { display: grid; grid-template-columns: 92px 1fr; gap: 6px; align-items: start; padding: 5px 0; border-top: 1px dashed var(--line) }
.cat:first-of-type { border-top: 0 }
.cat .lab { font-size: 12px; color: var(--muted); padding-top: 4px }
.slots { display: flex; flex-wrap: wrap; gap: 4px; min-width: 0 }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; padding: 2px 7px 2px 2px; border-radius: 6px; background: var(--panel2) }
.chip img { width: 22px; height: 22px; object-fit: contain }
.chip.empty { padding: 2px 7px; border: 1px dashed var(--line); background: transparent; color: var(--muted); min-height: 26px }
.chip.last { outline: 2px solid var(--accent) }
.pool { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px }
@media (max-width: 480px) { .pool { grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)) } }
.tile { position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 6px 8px; border-radius: 9px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); text-align: center; font-weight: 500; font-size: 12px; line-height: 1.2; min-height: 104px; font-family: var(--body) }
.tile .pic { width: 52px; height: 52px; object-fit: contain }
.tile .hs { font-size: 10px; color: var(--muted); font-family: var(--mono) }
.tile .herotag { position: absolute; top: 4px; left: 4px; width: 22px; height: 22px; border-radius: 5px; object-fit: cover }
.tile.sel { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent) }
.tile.takenA { background: var(--a-soft); border-color: var(--a) }
.tile.takenB { background: var(--b-soft); border-color: var(--b) }
.tile.takenA .pic, .tile.takenB .pic { filter: grayscale(.85); opacity: .55 }
.tile.blocked:not(.takenA):not(.takenB) { opacity: .4 }
.tile .own { position: absolute; top: 4px; right: 5px; font-size: 11px; font-weight: 800 }
.sectionlab { grid-column: 1 / -1; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-top: 6px; font-weight: 600 }
.lockbar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--panel); border-top: 1px solid var(--line); padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap; z-index: 5 }
.dock { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); width: min(720px, calc(100% - 24px)); background: var(--panel); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 8px 30px rgba(0,0,0,.25); padding: 10px 14px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; z-index: 6 }
.dock .dclock { font-family: var(--mono); font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; min-width: 64px }
.dock .dclock.low { color: var(--bad) }
.dock .dwho { font-family: var(--display); font-weight: 800; font-size: 17px; line-height: 1.15 }
.dock .dsub { font-size: 12px; color: var(--muted) }
.dock.mine { border: 2px solid var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 25%, transparent), 0 8px 30px rgba(0,0,0,.25) }
@media (prefers-reduced-motion: no-preference) { .dock.mine { animation: pulse 1.6s ease-in-out infinite } @keyframes pulse { 50% { box-shadow: 0 0 0 9px color-mix(in srgb, var(--accent) 10%, transparent), 0 8px 30px rgba(0,0,0,.25) } } }
body.hasdock .wrap { padding-bottom: 120px }
.rules { font-size: 14px; line-height: 1.5 }
.rcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr)); gap: 8px; margin-top: 8px }
.rcard { background: #fff; border-radius: 12px; padding: 9px 12px 10px; border-top: 4px solid var(--cc, var(--hacc)); box-shadow: 0 2px 0 rgba(15,24,64,.08), 0 4px 12px rgba(15,24,64,.08); display: flex; flex-direction: column; gap: 2px; min-width: 0 }
.rcard b { font-size: 15px; line-height: 1.25 } .rcard span { font-size: 13px; line-height: 1.4; color: var(--muted) }
.rules summary, details > summary { cursor: pointer }
.lacks { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; margin-top: 8px }
.lacks .hg { border: 1px solid var(--line); border-radius: 9px; padding: 6px 8px }
.lacks .hg > div { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; margin-bottom: 4px }
.lacks .hg img { width: 22px; height: 22px; border-radius: 5px }
.lacks label { display: flex; align-items: center; gap: 6px; font-size: 13px; padding: 2px 0 }
.lacks label img { width: 24px; height: 24px; object-fit: contain }
.army { background: linear-gradient(#3b4a6b, #2a3550); color: #fff; border-radius: 14px; padding: 12px; margin-bottom: 12px }
.army h3 { color: #fff; margin: 0 }
.army .tabs { display: flex; gap: 6px; margin-bottom: 10px }
.army .tabs button { background: rgba(255,255,255,.12); color: #fff; border-color: transparent }
.army .tabs button.on { background: #f5c542; color: #2a2a2a }
.capbar { display: flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 13px; margin: 8px 0 4px }
.capbar .bar { flex: 1; height: 8px; background: rgba(255,255,255,.15); border-radius: 99px; overflow: hidden }
.capbar .bar i { display: block; height: 100%; background: #f5c542 }
.capbar.full .bar i { background: #7bd66b }
.tray { display: flex; gap: 6px; flex-wrap: wrap; min-height: 74px; padding: 6px; background: rgba(0,0,0,.2); border-radius: 10px }
.tray .empty { color: rgba(255,255,255,.55); font-size: 13px; align-self: center; padding: 0 6px }
.unit { position: relative; width: 70px; height: 70px; border-radius: 10px; border: 2px solid rgba(255,255,255,.25); background: #5b6f99; padding: 0; overflow: hidden; cursor: pointer }
.unit img { width: 100%; height: 100%; object-fit: contain }
.unit .cnt { position: absolute; top: 2px; left: 4px; font-family: var(--display); font-weight: 800; font-size: 15px; color: #fff; text-shadow: 0 1px 2px #000, 0 0 2px #000 }
.unit .sp { position: absolute; bottom: 2px; right: 4px; font-size: 11px; font-weight: 700; color: #fff; text-shadow: 0 1px 2px #000 }
.unit.spell { background: #7a5ea8 } .unit.siege { background: #8a6b45 }
.unit:disabled { filter: grayscale(1); opacity: .35; cursor: not-allowed }
.unit:not(:disabled):hover { border-color: #f5c542 }
.train { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px }
.army .lab { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; opacity: .75; margin-top: 12px }
.hslots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px }
.hslot { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 4px; border-radius: 12px; border: 2px solid var(--line); background: var(--panel2); min-height: 132px; justify-content: center }
.hslot.on { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent) }
.hslot .hb { width: 64px; height: 64px; border-radius: 10px; object-fit: cover }
.hslot .plus { font-size: 34px; color: var(--muted); line-height: 1 }
.hslot .hn2 { font-size: 12px; font-weight: 600; text-align: center; line-height: 1.15 }
.hslot .gear { display: flex; gap: 3px; min-height: 26px }
.hslot .gear img, .hslot .gear span { width: 26px; height: 26px; border-radius: 6px; object-fit: contain; background: var(--panel) }
.hslot .gear span { border: 1px dashed var(--line); display: inline-block }
.herogrid { display: grid; grid-template-columns: repeat(2, 96px); gap: 8px; margin-top: 8px }
.herogrid .ico { width: 96px } .herogrid .ico img { width: 64px; height: 64px }
.hpanel { margin-top: 10px; padding: 10px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel) }
.icogrid { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 10px }
.ico { position: relative; width: 64px; padding: 4px 2px; display: flex; flex-direction: column; align-items: center; gap: 2px; border-radius: 10px; border: 2px solid var(--line); background: var(--panel2); font-size: 10px; font-weight: 600; line-height: 1.1; text-align: center }
.ico img { width: 44px; height: 44px; object-fit: contain }
.ico.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 15%, var(--panel2)) }
.ico.epic::after { content: "EPIC"; position: absolute; top: 2px; right: 3px; font-size: 8px; color: #a050e0 }
.ico:disabled { opacity: .35; cursor: not-allowed }
.unit.fixed { cursor: default }
.ctrs { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 6px }
.ctr { display: flex; align-items: center; gap: 6px; padding: 4px 6px; border: 1px solid var(--line); border-radius: 9px; background: var(--panel) }
.ctr.on { border-color: var(--accent) }
.ctr img { width: 34px; height: 34px; object-fit: contain }
.ctr .nm { flex: 1; min-width: 0; font-size: 13px; line-height: 1.2 } .ctr .nm small { display: block; color: var(--muted); font-size: 11px }
.ctr input { width: 48px; text-align: center; padding: 4px }
.ctr button { padding: 2px 9px; font-size: 16px; line-height: 1.2 }
.herorow { display: grid; grid-template-columns: 170px 1fr 1fr 1fr; gap: 8px; align-items: center; padding: 6px 0; border-top: 1px dashed var(--line) }
.herorow:first-of-type { border-top: 0 }
@media (max-width: 640px) { .herorow { grid-template-columns: 1fr 1fr } }
.herorow .hn { display: flex; align-items: center; gap: 6px; font-weight: 600; font-size: 14px }
.herorow .hn img { width: 30px; height: 30px; border-radius: 6px }
.herorow select { width: 100%; min-width: 0 }
.meter { font-family: var(--mono); font-size: 13px } .meter.over { color: var(--bad); font-weight: 700 }
.linkbox { width: 100%; font-family: var(--mono); font-size: 12px }
.log { max-height: 260px; overflow: auto; font-size: 12px }
.log div { padding: 3px 0; border-bottom: 1px solid var(--line) }
.note { font-size: 12px; padding: 8px 10px; border-radius: 8px; background: var(--panel2); color: var(--muted) }
.err { color: var(--bad); font-size: 13px }
.toast { position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: 8px; z-index: 20; font-weight: 600; max-width: calc(100% - 32px) }
.win { font-family: var(--display); font-size: 22px; font-weight: 800 }
.heroes { display: flex; gap: 6px; flex-wrap: wrap }
.heroes img { width: 30px; height: 30px; border-radius: 6px }
@media (prefers-reduced-motion: no-preference) { .tile { transition: transform .08s } .tile:active { transform: scale(.97) } }


/* ---------- sticker-album theme for every page ---------- */
/* Light "album page" cards: tokens flip back to dark ink on a pale page. */
.panel, .status, .dock, .lockbar, .mrow, .hpanel, .toast, .bigbtn, .hrooms {
  --bg: #ffffff; --panel: #ffffff; --panel2: #e3e8fb; --fg: #0f1840; --muted: #4a5585; --line: #c9d2f3;
  --sel: #2a49d0; --a: #8f6400; --a-soft: #fff4cc; --b: #d8432f; --b-soft: #ffe4df;
  --ok: #1e9e62; --warn: #a86a00; --bad: #c7321f; color-scheme: light; color: var(--fg) }
h2 { font: 22px/1.15 var(--display); margin: 0 0 12px; letter-spacing: .005em }
.panel h2 { font-size: 20px }
h3 { font-family: var(--body); font-weight: 700; letter-spacing: .08em }
.panel { background: #f4f6ff; border: 0; border-radius: 22px; padding: 20px; box-shadow: 0 14px 40px rgba(0,4,30,.45) }
.mrow { background: #f4f6ff; border: 0; border-radius: 16px; padding: 12px 14px; box-shadow: 0 6px 18px rgba(0,4,30,.35) }
.mrow:hover { box-shadow: 0 0 0 3px var(--hyou), 0 6px 18px rgba(0,4,30,.35) }
a { color: inherit }
.muted a, a.muted { color: var(--muted) } a.muted:hover { color: var(--fg) }
button, .btn { font-family: var(--body); font-weight: 700; border: 0; background: var(--panel2); color: var(--fg); padding: 10px 16px; border-radius: 12px; box-shadow: 0 3px 0 rgba(0,4,30,.18) }
button:hover, .btn:hover { filter: brightness(1.06) }
button:active, .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,4,30,.18) }
.primary { background: var(--hyou) !important; color: var(--hdark) !important; box-shadow: 0 4px 0 var(--hyou-sh) !important }
button.danger { color: var(--bad) }
button:disabled { box-shadow: none; transform: none; filter: none }
button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible { outline: 3px solid var(--hyou); outline-offset: 3px }
.panel :focus-visible, .dock :focus-visible, .status :focus-visible { outline-color: var(--hacc) }
input, select { background: var(--bg); border: 2px solid var(--line); border-radius: 11px; padding: 9px 11px }
input:focus, select:focus { border-color: var(--sel); outline: none }
input[type=checkbox] { accent-color: var(--hacc); width: 17px; height: 17px }
label.f { font-weight: 600 }
.pill { font: 11px/1 var(--display); letter-spacing: .02em; padding: 5px 8px; border-radius: 7px; text-transform: none }
.pill.lobby { background: var(--hok); color: #fff } .pill.draft { background: var(--hacc); color: #fff } .pill.attack { background: var(--hopp); color: #fff } .pill.done { background: var(--hdark2); color: #fff }
.th { font: 12px/1 var(--display); padding: 6px 8px; border-radius: 8px; background: var(--hyou); color: var(--hdark); transform: rotate(-3deg); display: inline-block }
.seatA { color: var(--a) } .seatB { color: var(--b) }
.chips button { box-shadow: none; padding: 7px 13px; border-radius: 999px; background: var(--panel2) }
.chips button.on { background: var(--hacc); color: #fff }
/* room header */
.steps span { font-weight: 600; background: rgba(255,255,255,.08); color: var(--muted); padding: 6px 12px }
.steps span.on { background: var(--hyou); color: var(--hdark) }
.status { background: #f4f6ff; border: 0; border-radius: 20px; padding: 14px 18px; box-shadow: 0 14px 40px rgba(0,4,30,.45) }
.status.turnA { box-shadow: inset 6px 0 0 var(--hyou), 0 14px 40px rgba(0,4,30,.45) }
.status.turnB { box-shadow: inset 6px 0 0 var(--hopp), 0 14px 40px rgba(0,4,30,.45) }
.status .who, .roster .name, .dock .dwho, .win, .bigbtn b { font-family: var(--display); font-weight: 400 }
.clock, .dock .dclock { font-family: var(--display); font-weight: 400 }
/* rosters as sticker pages */
.roster { border-top: 0; box-shadow: inset 0 6px 0 var(--hyou), 0 14px 40px rgba(0,4,30,.45) }
.roster.B { box-shadow: inset 0 6px 0 var(--hopp), 0 14px 40px rgba(0,4,30,.45) }
.roster .name { font-size: 20px }
.cat { border-top: 2px dashed var(--line) }
.chip { background: #fff; border-radius: 9px; padding: 3px 8px 3px 3px; font-weight: 600; box-shadow: 0 2px 0 rgba(15,24,64,.1), 0 3px 8px rgba(15,24,64,.1); border-bottom: 3px solid var(--cc, transparent) }
.chip img { width: 24px; height: 24px }
.chip.empty { background: var(--hslot); border: 2px dashed var(--hline); box-shadow: none; color: var(--hline); font-weight: 600 }
.chip.last { outline: 3px solid var(--sel) }
.chip.empty.flex { border-color: var(--c-epic); color: var(--c-epic); background: #f1e8fb }
/* pool tiles as stickers */
.pool { gap: 10px }
.tile { border: 3px solid #fff; border-radius: 14px; background: #fff; box-shadow: 0 2px 0 rgba(15,24,64,.1), 0 6px 14px rgba(15,24,64,.14); font-weight: 600; cursor: pointer }
.tile::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: -3px; height: 4px; border-radius: 2px; background: var(--cc, transparent) }
.tile:hover:not(.blocked) { transform: translateY(-2px) rotate(-1deg) }
.tile .pic { width: 56px; height: 56px }
.tile.sel { border-color: var(--hacc); box-shadow: 0 0 0 3px var(--hacc), 0 8px 18px rgba(42,73,208,.3) }
.tile.takenA { background: var(--a-soft); border-color: var(--hyou) }
.tile.takenB { background: var(--b-soft); border-color: var(--hopp) }
.tile .own { font: 11px/1 var(--display); top: 6px; right: 7px } .tile.takenA .own { color: #8f6400 } .tile.takenB .own { color: var(--b) }
.sectionlab { font-weight: 700; letter-spacing: .08em }
/* dock */
.dock { background: #f4f6ff; border: 0; border-radius: 22px; box-shadow: 0 16px 40px rgba(0,4,30,.55); padding: 12px 16px }
.dock .dclock { font-size: 28px }
.dock.mine { border: 0; box-shadow: 0 0 0 4px var(--hyou), 0 16px 40px rgba(0,4,30,.55) }
@media (prefers-reduced-motion: no-preference) { .dock.mine { animation: hpulse 1.6s ease-in-out infinite } @keyframes hpulse { 50% { box-shadow: 0 0 0 9px rgba(255,201,40,.35), 0 16px 40px rgba(0,4,30,.55) } } }
.lockbar { background: #f4f6ff; border-top: 0; box-shadow: 0 -10px 30px rgba(0,4,30,.4) }
/* lobby */
.lacks .hg { border: 0; background: #fff; border-radius: 14px; padding: 8px 10px; box-shadow: 0 2px 0 rgba(15,24,64,.08), 0 4px 12px rgba(15,24,64,.08) }
/* notes and toasts */
.note { border-radius: 14px; padding: 10px 14px; font-size: 13px; background: var(--panel2) }
.toast { background: var(--hyou); color: var(--hdark); border-radius: 12px; font-weight: 700; box-shadow: 0 8px 24px rgba(0,4,30,.4) }
.log div { border-bottom: 1px dashed var(--line) }
.bigbtn { background: #f4f6ff; border: 0; border-radius: 18px }
/* army builder: the in-game panel, in album navy */
.army { background: #0a134a; background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,.07) 1px, transparent 0); background-size: 18px 18px; border-radius: 22px; padding: 16px; box-shadow: 0 14px 40px rgba(0,4,30,.45), inset 0 0 0 2px rgba(255,255,255,.06) }
.army .tabs button { background: rgba(255,255,255,.1); box-shadow: none }
.army .tabs button.on { background: var(--hyou); color: var(--hdark); box-shadow: 0 3px 0 var(--hyou-sh) }
.capbar { font-family: var(--display); font-weight: 400 }
.capbar .bar { height: 10px; background: rgba(255,255,255,.12) }
.capbar .bar i { background: var(--hyou) } .capbar.full .bar i { background: #6ee7a8 }
.tray { background: rgba(255,255,255,.05); border: 2px dashed rgba(255,255,255,.14); border-radius: 14px }
.unit { border: 3px solid #fff; border-radius: 12px; background: #fff; box-shadow: 0 3px 0 rgba(0,0,0,.25) }
.unit::after { content: ""; position: absolute; left: 6px; right: 6px; bottom: 0; height: 4px; border-radius: 2px; background: var(--cc, transparent) }
.unit.spell, .unit.siege { background: #fff }
.unit:not(:disabled):hover { border-color: var(--hyou) }
.unit .cnt { font-family: var(--display); font-weight: 400; color: var(--hdark); text-shadow: 0 0 3px #fff, 0 0 3px #fff }
.unit .sp { color: var(--hdark); text-shadow: 0 0 3px #fff, 0 0 3px #fff }
.hslot { border: 3px solid #fff; background: #fff; border-radius: 16px; box-shadow: 0 2px 0 rgba(15,24,64,.1), 0 6px 14px rgba(15,24,64,.12); cursor: pointer }
.hslot.on { border-color: var(--hacc); box-shadow: 0 0 0 3px var(--hacc) }
.hslot .hn2 { font-weight: 700 }
.hslot .gear span { border: 2px dashed var(--hline); background: var(--hslot) }
.hpanel { background: #fff; border: 0; border-radius: 16px; box-shadow: inset 0 0 0 2px var(--line) }
.ico { border: 3px solid #fff; background: #fff; border-radius: 12px; box-shadow: 0 2px 0 rgba(15,24,64,.1), 0 4px 10px rgba(15,24,64,.1); font-weight: 600 }
.ico.on { border-color: var(--hacc); background: #e8edff }
.ico.epic::after { color: var(--c-epic); font-weight: 700 }
.linkbox { background: #fff }
.hslots { grid-template-columns: repeat(4, minmax(0, 1fr)) }
.hslot { min-width: 0 } .hslot .hb { max-width: 100% }
@media (max-width: 480px) { .hslot .hb { width: 52px; height: 52px } .hslot .gear img, .hslot .gear span { width: 20px; height: 20px } .hslot .hn2 { font-size: 11px } }
input, select { font-weight: 500 }
/* player names on light cards: dark ink with a seat-coloured highlighter stroke */
.panel .seatA, .status .seatA, .dock .seatA, .roster .name.seatA { color: var(--fg); box-shadow: inset 0 -.38em 0 rgba(255,201,40,.75) }
.panel .seatB, .status .seatB, .dock .seatB, .roster .name.seatB { color: var(--fg); box-shadow: inset 0 -.38em 0 rgba(255,106,85,.45) }


/* create room */
.cr-top { margin-bottom: 10px }
.cr-grid { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 20px; align-items: start }
.cr-grid > * { min-width: 0 }
.cr-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap }
.cr-head h2 { margin: 0; font-size: 28px }
.cr-head .tag { font: 12px/1 var(--display); padding: 6px 9px; border-radius: 7px; transform: rotate(-3deg); background: var(--hacc); color: #fff }
.cr-head .tag.ex { background: var(--hyou); color: var(--hdark) }
.cr-lead { margin: 6px 0 18px; font-size: 14px }
.cr-names { display: grid; grid-template-columns: 1fr 1fr; gap: 12px }
.cr-sec { margin-top: 18px }
.cr-th { display: flex; gap: 8px; flex-wrap: wrap }
.cr-th button { font: 16px/1 var(--display); width: 54px; height: 46px; padding: 0; border-radius: 12px; background: #fff; color: var(--hdark2); box-shadow: 0 2px 0 rgba(15,24,64,.1), 0 4px 10px rgba(15,24,64,.08) }
.cr-th button.on { background: var(--hyou); color: var(--hdark); box-shadow: 0 4px 0 var(--hyou-sh); transform: rotate(-3deg) }
.cr-steps { display: grid; grid-template-columns: 1fr 1fr; gap: 10px }
.cr-step { position: relative; display: flex; align-items: center; gap: 10px; background: #fff; border-radius: 16px; padding: 10px 10px 10px 8px; box-shadow: 0 2px 0 rgba(15,24,64,.1), 0 6px 14px rgba(15,24,64,.1) }
.cr-step::after { content: ""; position: absolute; left: 14px; right: 14px; bottom: -3px; height: 4px; border-radius: 2px; background: var(--cc) }
.cr-step img, .cr-clock { width: 44px; height: 44px; object-fit: contain; flex: none }
.cr-clock { display: grid; place-items: center; color: var(--hacc) } .cr-clock svg { width: 30px; height: 30px }
.cr-lab { flex: 1; min-width: 0; line-height: 1.15 } .cr-lab b { display: block; font-size: 14px } .cr-lab small { color: var(--muted); font-size: 11.5px }
.cr-ctl { display: flex; align-items: center; gap: 4px; flex: none }
.cr-ctl button { width: 34px; height: 34px; padding: 0; border-radius: 10px; font: 20px/1 var(--display); background: var(--hslot); color: var(--hdark) }
.cr-ctl button:disabled { opacity: .35 }
.cr-ctl output { font: 20px/1 var(--display); min-width: 46px; text-align: center }
.cr-side { position: sticky; top: 16px }
.cr-slots { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 5px }
.cr-slots i { aspect-ratio: 1; border-radius: 7px; background: #fff; border-bottom: 4px solid var(--c-troop); box-shadow: 0 2px 6px rgba(15,24,64,.1) }
.cr-slots i.super { border-color: var(--c-super) } .cr-slots i.spell { border-color: var(--c-spell) } .cr-slots i.siege { border-color: var(--c-siege) } .cr-slots i.epic { border-color: var(--c-epic) }
.cr-big { margin: 12px 0 2px; font-weight: 600 } .cr-big b { font: 26px/1 var(--display); margin-right: 4px }
.cr-pool { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 6px }
.cr-pool span { background: #fff; border-radius: 10px; padding: 6px 10px; font-size: 12.5px; font-weight: 600; box-shadow: inset 0 -3px 0 var(--cc), 0 2px 6px rgba(15,24,64,.08) }
.cr-pool b { font: 15px/1 var(--display); margin-right: 5px }
.cr-go { width: 100%; margin-top: 14px; font-size: 18px; padding: 15px; border-radius: 14px }
.cr-go:disabled { opacity: .5 }
@media (max-width: 1000px) { .cr-grid { grid-template-columns: 1fr } .cr-side { position: static } }
@media (max-width: 620px) { .cr-names, .cr-steps { grid-template-columns: 1fr } .cr-th { gap: 6px; flex-wrap: nowrap } .cr-th button { width: auto; flex: 1 1 0; min-width: 0; height: 42px; font-size: 14px } .cr-head h2 { font-size: 24px } }


/* my rooms */
.hmine .rh { display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; margin-bottom:10px }
.hmine .rh h2 { font:22px var(--hdisp); margin:0; color:#fff } .hmine .rh span { color:var(--hmut); font-size:13px }
.hcards { display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:14px }
.hcard { position:relative; display:flex; flex-direction:column; gap:7px; background:var(--hpage); color:var(--hdark); text-decoration:none; border-radius:18px; padding:14px 16px 12px; box-shadow:0 10px 26px rgba(0,4,30,.45); transition:transform .15s }
.hcard:hover { transform:translateY(-3px) }
.hcard .hcn { font:18px/1.1 var(--hdisp) }
.hcard small { color:var(--hdark2); font-size:12.5px }
.hcard .hsnake { min-width:0 }
.hcard.turn { box-shadow:0 0 0 4px var(--hyou), 0 10px 26px rgba(0,4,30,.45) }
.hturn { position:absolute; top:-10px; right:14px; font:12px/1 var(--hdisp); background:var(--hyou); color:var(--hdark); padding:6px 9px; border-radius:8px; transform:rotate(3deg); box-shadow:0 3px 0 var(--hyou-sh) }
@media (prefers-reduced-motion:no-preference) { .hcard.turn { animation:hturnpulse 1.4s ease-in-out infinite } @keyframes hturnpulse { 50% { box-shadow:0 0 0 8px rgba(255,201,40,.35), 0 10px 26px rgba(0,4,30,.45) } } }
.hwatch { display:inline-block; margin-top:10px; font:16px/1 var(--hdisp); background:var(--hyou); color:var(--hdark); text-decoration:none; padding:12px 26px; border-radius:14px; box-shadow:0 4px 0 var(--hyou-sh) }
.hwatch:hover { filter:brightness(1.05) } .hwatch:active { transform:translateY(2px); box-shadow:0 2px 0 var(--hyou-sh) }
.face .cl { text-align:center }
/* your turn */
.yturn { position:fixed; left:50%; top:38%; transform:translate(-50%,-50%) rotate(-3deg); z-index:30; pointer-events:none; text-align:center; background:var(--hyou); color:var(--hdark); padding:22px 38px 18px; border-radius:24px; box-shadow:0 8px 0 var(--hyou-sh), 0 30px 80px rgba(0,4,30,.6); animation:ytin 1.9s cubic-bezier(.2,.9,.3,1.2) both }
.yturn b { display:block; font:clamp(34px,8vw,64px)/1 var(--hdisp) } .yturn span { display:block; margin-top:6px; font-weight:600 }
@keyframes ytin { 0% { opacity:0; transform:translate(-50%,-50%) rotate(-3deg) scale(.6) } 12% { opacity:1; transform:translate(-50%,-50%) rotate(-3deg) scale(1.04) } 20% { transform:translate(-50%,-50%) rotate(-3deg) scale(1) } 82% { opacity:1 } 100% { opacity:0; transform:translate(-50%,-60%) rotate(-3deg) scale(.96) } }
body.myturn::after { content:""; position:fixed; inset:0; pointer-events:none; z-index:4; box-shadow:inset 0 0 0 5px var(--hyou), inset 0 0 60px rgba(255,201,40,.35) }
@media (prefers-reduced-motion:no-preference) { body.myturn::after { animation:edgeglow 1.6s ease-in-out infinite } @keyframes edgeglow { 50% { box-shadow:inset 0 0 0 5px var(--hyou), inset 0 0 110px rgba(255,201,40,.5) } } }
@media (prefers-reduced-motion:reduce) { .yturn { animation:none } }
.dock .snd { width:40px; height:40px; padding:0; display:grid; place-items:center; box-shadow:none } .dock .snd svg { width:22px; height:22px }
.linkbtn { display:inline-flex; align-items:center; gap:7px; background:rgba(255,255,255,.1) !important; color:#fff }
.linkbtn svg { width:17px; height:17px }
.invite { display:grid; gap:8px; margin-top:6px } .invite .row { flex-wrap:nowrap } .invite input { flex:1; min-width:0; font-family:var(--mono); font-size:12px }
.htable tr.sel td { background:#e6ecff } .htable tr.sel td:first-child { box-shadow:inset 4px 0 0 var(--hacc) }

/* ---------- home: sticker album, live-first ---------- */
body { --hg:#101c5c; --hbar:#0a134a; --hink:#fff; --hmut:#aab6f0; --hpage:#f4f6ff; --hslot:#dfe5fb; --hslot2:#d0d8f8; --hline:#aab8ee;
  --hyou:#ffc928; --hyou-sh:#b88a00; --hopp:#ff6a55; --hdark:#0f1840; --hdark2:#4a5585; --hok:#1e9e62; --hok-sh:#13693f; --hacc:#2a49d0;
  --c-troop:#f5b800; --c-super:#f0582a; --c-spell:#2f7de1; --c-siege:#1f9e74; --c-epic:#8e44d9;
  --hdisp:'Bowlby One',system-ui,sans-serif; --hui:'Rubik',system-ui,sans-serif;
  background:var(--hg); color:var(--hink); font-family:var(--hui); font-size:15px; color-scheme:dark;
  background-image:radial-gradient(circle at 1px 1px,rgba(255,255,255,.07) 1px,transparent 0); background-size:18px 18px }
body ::selection { background:var(--hyou); color:var(--hdark) }
body .wrap { max-width:1240px; padding-block:0 60px }
body.hasdock .wrap { padding-bottom:130px }
body header.top { margin:0 0 22px; padding-block:14px; border-bottom:1px solid rgba(255,255,255,.08) }
body header.top h1 { font:22px/1 var(--hdisp) }
body .mode { background:rgba(255,255,255,.08); color:var(--hmut) }
body .mode.live { color:#6ee7a8 }
body a:focus-visible, body button:focus-visible { outline:3px solid var(--hyou); outline-offset:3px }
header.top h1 a { display:inline-flex; align-items:center; gap:10px }
.logo { display:inline-grid; place-items:center; width:30px; height:30px; border-radius:9px; background:#ffc928; color:#0f1840; font:15px/1 'Bowlby One',system-ui,sans-serif; font-style:normal; transform:rotate(-6deg); box-shadow:0 2px 0 rgba(0,0,0,.25) }
.hlink { color:var(--muted); text-decoration:none; font-size:13px; font-weight:600 }
body .hlink { color:var(--hmut) } body .hlink:hover { color:#fff }
.h-stage { display:grid; gap:22px }
.h-stage > * { min-width:0 }
.fh { display:flex; align-items:center; gap:12px; flex-wrap:wrap }
.fh .tag { font:12px/1 var(--hdisp); padding:6px 9px; border-radius:7px; transform:rotate(-3deg); background:var(--hopp); color:#fff }
.fh .tag.last { background:var(--hacc) } .fh .tag.ex { background:var(--hyou); color:var(--hdark) }
.fh h2 { font:22px/1.1 var(--hdisp); margin:0; color:#fff }
.fh .sub { color:var(--hmut); font-size:14px }
.ap.quiet { opacity:.55 }
.fh .go2 { margin-left:auto; color:var(--hyou); font-weight:700; font-size:14px; text-decoration:none }
.face { display:grid; grid-template-columns:1fr 200px 1fr; gap:18px; align-items:center; margin-top:14px }
.face > * { min-width:0 }
.ap { background:var(--hpage); color:var(--hdark); border-radius:22px; padding:18px 18px 20px; box-shadow:0 14px 40px rgba(0,4,30,.55) }
.ap .who { display:flex; align-items:center; gap:10px; margin-bottom:12px }
.ap .av { width:40px; height:40px; border-radius:50%; display:grid; place-items:center; font:17px var(--hdisp); flex:none }
.ap.A .av { background:var(--hyou); color:var(--hdark) } .ap.B .av { background:var(--hopp); color:#fff }
.ap .nm { font:20px/1.05 var(--hdisp); overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.ap small { color:var(--hdark2); font-size:12px }
.ap.B .who { flex-direction:row-reverse; text-align:right }
.ap .who > div { min-width:0 }
.g8 { display:grid; grid-template-columns:repeat(8,minmax(0,1fr)); gap:7px }
.g8 .sk, .g8 .sl { aspect-ratio:1; border-radius:10px; min-width:0; min-height:0 }
.g8 .sk { background:#fff; border:3px solid #fff; display:grid; place-items:center; position:relative; box-shadow:0 2px 0 rgba(15,24,64,.12),0 6px 12px rgba(15,24,64,.16); transform:rotate(var(--r,0deg)) }
.g8 .sk img { width:86%; height:86%; min-width:0; object-fit:contain }
.g8 .sk::after { content:""; position:absolute; left:3px; right:3px; bottom:-3px; height:4px; border-radius:2px; background:var(--cc) }
.g8 .sk.last { outline:3px solid var(--hyou); outline-offset:1px }
.ap.B .g8 .sk.last { outline-color:var(--hopp) }
.g8 .sl { background:var(--hslot); border:2px dashed var(--hline); display:grid; place-items:center; color:var(--hline); font:11px var(--hdisp) }
.g8 .sl.next { border-color:var(--hopp); background:#ffe4df; color:var(--hopp); animation:hbreathe 1.6s ease-in-out infinite }
.ap.A .g8 .sl.next { border-color:var(--hyou); background:#fff4cc; color:#8a6500 }
@keyframes hbreathe { 50% { box-shadow:0 0 0 6px rgba(255,201,40,.3) } }
.hclock { position:relative; width:180px; height:180px; margin:0 auto; display:grid; place-items:center; text-align:center }
.hclock svg { position:absolute; inset:0; transform:rotate(-90deg) }
.hclock .disc { width:132px; height:132px; border-radius:50%; background:#fff; border:6px solid #fff; box-shadow:0 10px 24px rgba(0,0,0,.35); display:grid; place-items:center; color:var(--hdark); transform:rotate(-4deg) }
.hclock b { font:44px/1 var(--hdisp); display:block }
.hclock b.sm { font-size:24px }
.hclock small { font-size:11px; font-weight:700; color:var(--hdark2); text-transform:uppercase; letter-spacing:.06em }
.picking { text-align:center; color:#fff; font:15px var(--hdisp); margin-top:8px }
.picking .A { color:var(--hyou) } .picking .B { color:var(--hopp) }
.exnote { color:var(--hmut); font-size:13px; margin-top:10px }
.acts { display:grid; grid-template-columns:1.5fr 1fr 1fr; gap:14px }
.ac { display:flex; align-items:center; gap:12px; padding:14px; border-radius:18px; background:rgba(255,255,255,.08); border:2px solid rgba(255,255,255,.14); color:#fff; text-decoration:none; transition:transform .12s }
.ac:hover { background:rgba(255,255,255,.14) }
.ac img { width:50px; height:50px; object-fit:contain; flex:none }
.ac strong { font:17px var(--hdisp); display:block }
.ac span { font-size:12.5px; color:var(--hmut) }
.ac.main { background:var(--hyou); border-color:var(--hyou); color:var(--hdark); box-shadow:0 4px 0 var(--hyou-sh) }
.ac.main span { color:#5a4100; font-weight:600 } .ac.main strong { font-size:22px }
.ac.main:active { transform:translateY(3px); box-shadow:0 1px 0 var(--hyou-sh) }
.hrooms { background:var(--hpage); color:var(--hdark); border-radius:22px; padding:20px 22px 12px; box-shadow:0 14px 40px rgba(0,4,30,.55) }
.hrooms .rh { display:flex; align-items:baseline; gap:12px; flex-wrap:wrap }
.hrooms h2 { font:22px var(--hdisp); margin:0; color:var(--hdark) }
.hrooms .rh > span { color:var(--hdark2); font-size:13px }
.hf { display:flex; gap:6px; margin-left:auto; flex-wrap:wrap }
.hf button { background:var(--hslot); color:var(--hdark); border:0; font-weight:600; font-size:13px; padding:6px 12px; border-radius:999px }
.hf button.on { background:var(--hacc); color:#fff }
.htable { width:100%; border-collapse:collapse; margin-top:10px }
.htable td { padding:12px 8px; border-top:2px dashed var(--hslot); vertical-align:middle }
.htable tr[data-hsel] { cursor:pointer }
.htable tr[data-hsel]:hover td { background:#eaeefc }
.htable tr.mine td { background:#fff }
.htable tr.sel td, .htable tr.sel:hover td { background:#fff4cc }
.hpick { all:unset; cursor:pointer; display:block; font-weight:700 }
.hpick:focus-visible { outline:3px solid var(--hacc); outline-offset:2px; border-radius:4px }
.htable td.hact { text-align:right; white-space:nowrap }
.htable td.hact .hbtn + .hbtn { margin-left:6px }
.hbtn.hdel { border:0; cursor:pointer; color:#b3261e; background:#fde4e1; font:inherit; font-weight:700; font-size:13px }
.hbtn.hdel.primary { background:#b3261e !important; color:#fff !important }
.go2.hback { background:none; border:0; padding:0; cursor:pointer; font:inherit; font-weight:700; font-size:14px } .htable tr.mine td:first-child { border-radius:12px 0 0 12px } .htable tr.mine td:last-child { border-radius:0 12px 12px 0 }
.htable .nm strong { display:block; font-weight:700 }
.htable .nm .hpick + small { display:block } .htable .nm small { color:var(--hdark2); font-size:12.5px }
.htable td.sn { width:32% } .htable td.sn small { display:block; color:var(--hdark2); font-size:12px; margin-top:5px }
.hduo { position:relative; width:60px; height:44px }
.hduo i { position:absolute; width:36px; height:36px; border-radius:50%; display:grid; place-items:center; font:14px var(--hdisp); font-style:normal; border:3px solid var(--hpage) }
.hduo i:first-child { left:0; top:0; z-index:1; background:var(--hyou); color:var(--hdark) }

<script src="firebase-config.js"></script>

<script>
const DATA = /*__DATA__*/{};
const ITEMS = DATA.items, HEROES = DATA.heroes, COMMONS = DATA.commons || [], PETS = DATA.pets || [];
const BYID = Object.fromEntries(ITEMS.map(i => [i.id, i]));
const CATS = [
  { k: "troop", label: "Troops" }, { k: "super", label: "Super troops" },
  { k: "spell", label: "Spells" }, { k: "siege", label: "Siege machines" }, { k: "epic", label: "Epic equipment" }];
const TH_LEVELS = [12, 13, 14, 15, 16, 17, 18, 19];
const EPICS_PER_HERO = 2;
const DEFAULT_SETTINGS = { troops: 7, supers: 2, spells: 4, sieges: 1, epics: 4, timer: 20 };
const EPICS = ITEMS.filter(i => i.c === "epic");
const EQUIP = Object.fromEntries([...EPICS, ...COMMONS].map(e => [e.id, e]));
const PETBY = Object.fromEntries(PETS.map(p => [p.id, p]));
// Army capacity by Town Hall. These are estimates you can change in the builder.
// Max capacity per Town Hall: [army camps, spells, Clan Castle troops, Clan Castle spells, Clan Castle siege machines].
// TH18 from Mikhail; TH12-17 researched on coc.guide, cocmap and clasher.us (2026-11). The army itself always takes 1 siege machine.
const CAP = { 12: [280, 11, 40, 2, 1], 13: [300, 11, 45, 2, 1], 14: [300, 11, 45, 3, 1], 15: [320, 11, 50, 3, 1], 16: [320, 11, 50, 3, 2], 17: [340, 11, 55, 3, 2], 18: [352, 11, 55, 4, 2], 19: [352, 11, 60, 4, 2] };  // TH19: CC level 15 holds 60; camps unchanged (Mikhail); CC spells/sieges assumed as TH18
// Pool follows the picks: about 1.5x what both players draft (at least 2 spare), 1.25x for epics.
// With the defaults (7 troops, 2 supers, 4 spells, 1 siege, 4 epics) that is 15 / 6 / 12 / 4 / 10.
const want = (n, f = 1.5) => n ? Math.max(Math.ceil(f * n), n + 2) : 0;
function autoSize(th, s) {
  const sup = want(2 * s.supers), all = want(2 * s.troops);
  const v = { troop: Math.max(0, all - sup), super: sup, spell: want(2 * s.spells), siege: want(2 * s.sieges), epic: want(2 * s.epics, 1.25) };
  for (const k in v) v[k] = Math.min(v[k], ITEMS.filter(i => i.c === k && i.th <= th).length);
  return v;
}
const MAX_REROLLS = 2;
const PREVIEW_MS = 30 * 1000;   // look at the board before the first pick
const ARMY_MS = 3 * 60 * 1000;  // time to build the army after the draft
const ADMIN_EMAIL = "admin@coc-megadraft.app"; // Firebase email/password account; the username "admin" maps to it
const inPreview = r => !!r.previewUntil && !r.paused && now() < r.previewUntil;

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const img = (it, cls = "pic") => `<img class="${cls}" src="${it.img}" alt="" loading="lazy" decoding="async">`;
const other = s => s === "A" ? "B" : "A";
// Shared clock. Every device reads the server's time (the HTTP Date header of this page) and keeps its offset,
// so a phone whose clock is a few seconds off still sees the same timer, preview and deadlines as everyone else.
const clock = { offset: 0, synced: false };
const now = () => Date.now() + clock.offset;
async function syncClock() {
  let best = null;
  for (let n = 0; n < 4; n++) {
    try {
      const t0 = performance.now(), res = await fetch(location.href.split("#")[0] + (location.search ? "&" : "?") + "clock=" + Math.random(), { method: "HEAD", cache: "no-store" });
      const t1 = performance.now(), d = Date.parse(res.headers.get("date") || "");
      if (!isFinite(d)) continue;
      // the header has whole seconds, so the server's time is somewhere in [d, d + 1000): aim for the middle
      const off = d + 500 - (Date.now() - (t1 - t0) / 2), rtt = t1 - t0;
      if (!best || rtt < best.rtt) best = { off, rtt };

  if (best && Math.abs(best.off) > 750) { clock.offset = Math.round(best.off); }

}
const CLIENT = Math.random().toString(36).slice(2);
function ls(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v) } catch (e) { return null } }

/* ---------- rules (pure) ---------- */
const perPlayer = st => st.troops + st.spells + st.sieges + st.epics;
const totalPicks = r => 2 * perPlayer(r.settings);
// Epics are a race: both players keep the full epic cap. Once no epic this seat could take is left in the pool,
// each of its unfilled epic slots becomes a flex pick for one more troop or spell (super, siege and per-hero limits stay).
// So with 6 epics split 4 and 2, both players still make the same number of picks.
function epicsOpenFor(r, seat, c = counts(r, seat)) {
  const lacks = r.players[seat]?.lacks || [];
  return (r.pool || []).filter(id => { const it = BYID[id]; return it?.c === "epic" && !lacks.includes(id) && !r.picks.some(p => p.id === id) && (c.hero[it.h] || 0) < EPICS_PER_HERO }).length;
}
function flexOf(r, seat, c = counts(r, seat)) { return epicsOpenFor(r, seat, c) ? 0 : Math.max(0, r.settings.epics - c.epic) }
const flexUsed = (r, seat, c = counts(r, seat)) => Math.max(0, c.troop + c.super - r.settings.troops) + Math.max(0, c.spell - r.settings.spells);
const flexLeft = (r, seat, c = counts(r, seat)) => Math.max(0, flexOf(r, seat, c) - flexUsed(r, seat, c));
const epicsLeft = r => (r.pool || []).filter(id => BYID[id]?.c === "epic" && !r.picks.some(p => p.id === id)).length;
// Slots shown on boards and strips: a seat that finished early shows only what it took.
function seatSlots(r, s) { return r.done?.[s] || (r.pool?.length && r.phase !== "draft") ? picksOf(r, s).length : perPlayer(r.settings) }
function shownPicks(r) { return seatSlots(r, "A") + seatSlots(r, "B") }
const seqSeat = (r, k) => { const F = r.first, O = other(F); if (k === 0) return F; return Math.floor((k - 1) / 2) % 2 === 0 ? O : F };
const picksOf = (r, seat) => r.picks.filter(p => p.seat === seat).map(p => BYID[p.id]).filter(Boolean);
function counts(r, seat) {
  const c = { troop: 0, super: 0, spell: 0, siege: 0, epic: 0, hero: {} };
  for (const it of picksOf(r, seat)) { c[it.c]++; if (it.c === "epic") c.hero[it.h] = (c.hero[it.h] || 0) + 1 }
  return c;
}
// A seat is out of the draft once it has every pick or chose to finish early. Its remaining turns are skipped.
const seatFull = (r, s) => !!(r.done && r.done[s]) || picksOf(r, s).length >= perPlayer(r.settings);
function curSlot(r) { const N = totalPicks(r); let k = r.turn ?? r.picks.length; while (k < N && seatFull(r, seqSeat(r, k))) k++; return k }
function turnSeat(r) { const k = curSlot(r); return k < totalPicks(r) ? seqSeat(r, k) : null }
function nextSeat(r) { const N = totalPicks(r); for (let k = curSlot(r) + 1; k < N; k++) { const s = seqSeat(r, k); if (!seatFull(r, s)) return s } return null }
const minsOf = st => st.min || { troops: Math.max(0, st.troops - 2), spells: Math.max(0, st.spells - 1), epics: Math.max(0, st.epics - 2), sieges: st.sieges };
function canFinish(r, s) { const m = minsOf(r.settings), c = counts(r, s); return c.troop + c.super >= m.troops && c.spell >= m.spells && c.epic >= m.epics && c.siege >= m.sieges }
function checkEnd(r) { if (curSlot(r) >= totalPicks(r)) { r.phase = "attack"; r.turnStart = null; r.armyUntil = now() + ARMY_MS } return r }
// Used when a seat has nothing legal left to pick, for example every remaining epic is one it doesn't own.
function finishStuck(r, s) { if (!s) return null; r.done = { ...(r.done || {}), [s]: true }; r.turnStart = now(); return checkEnd(r) }
function finishSeat(r, s) {
  if (r.phase !== "draft" || r.done?.[s]) return null;
  if (!canFinish(r, s)) return legalItems(r, s).length ? null : finishStuck(r, s);
  const before = turnSeat(r); r.done = { ...(r.done || {}), [s]: true };
  if (turnSeat(r) !== before) r.turnStart = now();
  return checkEnd(r);
}
function whyIllegal(r, seat, it) {
  if (!r.pool.includes(it.id)) return "Not in this room's pool";
  if (it.c === "epic" && r.players[seat]?.lacks?.includes(it.id)) return `${r.players[seat].name} doesn't own ${it.n}`;
  if (r.picks.some(p => p.id === it.id)) return "Already taken";
  const s = r.settings, c = counts(r, seat), fx = flexLeft(r, seat, c);
  if (it.c === "troop" || it.c === "super") {
    if (it.c === "super" && c.super >= s.supers) return `Super troop limit reached (${s.supers})`;
    if (c.troop + c.super >= s.troops && !fx) return `Troop slots full (${s.troops})`;
  }
  if (it.c === "spell" && c.spell >= s.spells && !fx) return `Spell slots full (${s.spells})`;
  if (it.c === "siege" && c.siege >= s.sieges) return `Siege slot full (${s.sieges})`;
  if (it.c === "epic") {
    if (c.epic >= s.epics) return `Equipment slots full (${s.epics})`;
    if ((c.hero[it.h] || 0) >= EPICS_PER_HERO) return `${HEROES[it.h].n} already has ${EPICS_PER_HERO} epics`;
  }
  return "";
}
const legalItems = (r, seat) => r.pool.map(id => BYID[id]).filter(it => it && !whyIllegal(r, seat, it));
function deadline(r) { if (!r.settings.timer || r.phase !== "draft" || r.paused || !r.turnStart) return null; return r.turnStart + r.settings.timer * 1000 }
const clockText = r => {
  if (inPreview(r)) return "Look " + fmt(r.previewUntil - now());
  if (!r.settings.timer) return "∞";
  return r.paused ? "Paused " + fmt(r.pausedLeft ?? r.settings.timer * 1000) : fmt(Math.max(0, deadline(r) - now()));
};
function applyPick(r, id, auto) {
  if (r.phase !== "draft" || inPreview(r)) return null;
  const k = curSlot(r); if (k >= totalPicks(r)) return null;
  const seat = seqSeat(r, k), it = BYID[id];
  if (!it || whyIllegal(r, seat, it)) return null;
  r.picks = [...r.picks, { id, seat, auto: !!auto, at: now(), slot: k }];
  r.turn = k + 1; r.turnStart = now();
  // a seat with nothing legal left (say the pool ran out of epics) is finished right away, so the draft ends once everything is taken
  for (let n = 0, ts; n < 2 && r.phase === "draft" && (ts = turnSeat(r)) && !legalItems(r, ts).length; n++) finishStuck(r, ts);
  return checkEnd(r);
}
function winner(r) {
  const a = r.results?.A, b = r.results?.B; if (!a || !b) return null;
  for (const k of ["stars", "pct", "time"]) { if (+a[k] > +b[k]) return "A"; if (+b[k] > +a[k]) return "B" }
  return "tie";
}
function shuffle(arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1));[a[i], a[j]] = [a[j], a[i]] } return a }
const eligible = (th, c) => ITEMS.filter(i => i.c === c && i.th <= th);
// Deal a limited, fully random pool so armies have to overlap.
// Epics come only from ones both players own, and always an even number so both can take the same amount.
function genPool(th, size, players) {
  const out = [];
  const lacks = [players?.A, players?.B].filter(p => p && !p.bot).map(p => p.lacks || []);
  for (const c of ["troop", "super", "spell", "siege", "epic"]) {
    let el = shuffle(eligible(th, c));
    // epics: only ones every player owns; if fewer than the pool size, all of them
    if (c === "epic") el = el.filter(i => !lacks.some(l => l.includes(i.id)));
    let n = Math.min(size[c], el.length);
    if (c === "epic") n -= n % 2;
    out.push(...el.slice(0, n).map(i => i.id));
  }
  return out;
}
// Both players ready: deal the pool now that we know what everyone owns, flip for first pick, start.
function startDraft(x) {
  x.pool = genPool(x.th, x.size, x.players);
  const start = now() + PREVIEW_MS;
  Object.assign(x, { phase: "draft", first: Math.random() < .5 ? "A" : "B", turn: 0, done: {}, picks: [], rerolls: 0, reroll: null, paused: false, pausedLeft: null, previewUntil: start, turnStart: start });
  return x;
}
function poolProblem(th, size, st) {
  const have = c => Math.min(size[c], eligible(th, c).length);
  if (st.supers > st.troops) return "Super troops can't exceed troop picks.";
  if (have("troop") + Math.min(have("super"), 2 * st.supers) < 2 * st.troops) return `The pool needs at least ${2 * st.troops} troops counting up to ${2 * st.supers} supers, so both players can fill ${st.troops} slots.`;
  if (have("spell") < 2 * st.spells) return `The pool needs at least ${2 * st.spells} spells.`;
  if (have("siege") < 2 * st.sieges) return `The pool needs at least ${2 * st.sieges} siege machines.`;
  return "";
}

/* ---------- store: live shared rooms, or this device only ---------- */
const FIREBASE_SDK = "11.0.2";
const ROOM_MAX_AGE = 24 * 3600 * 1000; // lists hide rooms older than a day
const Store = {
  live: false, backend: "local", db: null, fb: null, uid: null, isOwner: false, rooms: {}, listeners: [], loaded: false,
  emit() { this.listeners.forEach(f => f()) },
  async init() {
    try {
      if (window.claude?.use) {
        const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
        if (db) { this.db = db; this.live = true; this.uid = user ? await user.id() : null; this.isOwner = user ? !!(await user.isOwner()) : false }
      }
    } catch (e) { this.live = false }
    if (this.live) this.backend = "claude";
    else if (window.MEGADRAFT_FIREBASE?.apiKey) {
      try { await this.initFirebase(window.MEGADRAFT_FIREBASE); return } catch (e) { console.error(e); toast("Couldn't connect to the room server. Using this device only.") }
    }
    if (!this.live) {
      try { this.rooms = JSON.parse(ls("megadraft-rooms") || "{}") } catch (e) { this.rooms = {} }
      this.uid = "local"; this.isOwner = true; this.loaded = true; this.emit(); return;
    }
    const t = setTimeout(() => { if (!this.loaded) toast("Can't reach the rooms yet. Retrying…") }, 10000);
    this.db.collection("rooms").onSnapshot(snap => {
      this.loaded = true; clearTimeout(t);
      const o = {}; snap.docs.forEach(d => { if (d.exists) o[d.id] = d.data() }); this.rooms = o; this.emit();
    }, () => toast("Rooms stopped updating. Reload the page."));
  },
  async initFirebase(cfg) {
    const base = `https://www.gstatic.com/firebasejs/${FIREBASE_SDK}/`;
    const [app, fs, au] = await Promise.all([import(base + "firebase-app.js"), import(base + "firebase-firestore.js"), import(base + "firebase-auth.js")]);
    const a = app.initializeApp(cfg);
    const db = fs.getFirestore(a), auth = au.getAuth(a);
    if (cfg.emulatorHost) { fs.connectFirestoreEmulator(db, cfg.emulatorHost, cfg.firestorePort || 8085); au.connectAuthEmulator(auth, `http://${cfg.emulatorHost}:${cfg.authPort || 9099}`, { disableWarnings: true }) }
    // the player is always an anonymous account
    await auth.authStateReady();
    if (auth.currentUser && !auth.currentUser.isAnonymous) await au.signOut(auth); // older builds signed the admin in here
    const user = auth.currentUser || (await au.signInAnonymously(auth)).user;
    this.fb = { fs, db, au, auth }; this.uid = user.uid; this.live = true; this.backend = "firebase"; this.isOwner = false;
    // the admin signs in on a second, separate Firebase app, so the same browser can still play
    const b = app.initializeApp(cfg, "admin");
    const adb = fs.getFirestore(b), aauth = au.getAuth(b);
    if (cfg.emulatorHost) { fs.connectFirestoreEmulator(adb, cfg.emulatorHost, cfg.firestorePort || 8085); au.connectAuthEmulator(aauth, `http://${cfg.emulatorHost}:${cfg.authPort || 9099}`, { disableWarnings: true }) }
    this.adm = { db: adb, auth: aauth };
    aauth.authStateReady().then(() => { this.isAdmin = aauth.currentUser?.email === ADMIN_EMAIL; if (this.isAdmin) this.emit() });
    const t = setTimeout(() => { if (!this.loaded) toast("Can't reach the rooms yet. Retrying…") }, 10000);
    fs.onSnapshot(fs.collection(db, "rooms"), snap => {
      this.loaded = true; clearTimeout(t);
      const o = {}; snap.forEach(d => { o[d.id] = d.data() }); this.rooms = o; this.emit();
    }, err => { console.error(err); toast("Rooms stopped updating. Reload the page.") });
  },
  async adminLogin(name, pass) {
    const { au } = this.fb;
    if (name.trim().toLowerCase() !== "admin") throw new Error("bad user");
    await au.signInWithEmailAndPassword(this.adm.auth, ADMIN_EMAIL, pass);
    this.isAdmin = true; this.emit();
  },
  async adminLogout() {
    await this.fb.au.signOut(this.adm.auth);
    this.isAdmin = false; this.emit();
  },
  persist() { if (!this.live) ls("megadraft-rooms", JSON.stringify(this.rooms)) },
  async create(r) {
    const id = "r" + now().toString(36) + Math.random().toString(36).slice(2, 5);
    if (!this.live) { this.rooms[id] = r; this.persist(); this.emit(); return id }
    if (this.backend === "firebase") { const { fs, db } = this.fb; await fs.setDoc(fs.doc(db, "rooms", id), r); return id }
    await this.db.doc("rooms/" + id).set(r); return id;
  },
  async remove(id) {
    if (!this.live) { delete this.rooms[id]; this.persist(); this.emit(); return }

    if (this.backend === "firebase") { const { fs } = this.fb, db = this.isAdmin ? this.adm.db : this.fb.db; return fs.deleteDoc(fs.doc(db, "rooms", id)) }
    await this.db.doc("rooms/" + id).delete();
  },
  async mutate(id, fn) {
    if (!this.live) {
      const cur = this.rooms[id]; if (!cur) return false;
      const next = fn(structuredClone(cur)); if (!next) return false;
      this.rooms[id] = next; this.persist(); this.emit(); return true;
    }
    if (this.backend === "firebase") {
      // server-side transaction: two players can't both take the same pick
      const { fs, db } = this.fb, ref = fs.doc(db, "rooms", id);
      return fs.runTransaction(db, async tx => {
        const s = await tx.get(ref); if (!s.exists()) return false;
        const next = fn(structuredClone(s.data())); if (!next) return false;
        tx.set(ref, next); return true;
      });
    }
    const ref = this.db.doc("rooms/" + id);
    let got = false;
    for (let k = 0; k < 8 && !got; k++) {
      try { got = (await ref.acquire({ holder: CLIENT, ttlMs: 4000 })).acquired } catch (e) { break }
      if (!got) await new Promise(res => setTimeout(res, 250 + Math.random() * 250));
    }
    const snap = await ref.get(); if (!snap.exists) return false;
    const next = fn(structuredClone(snap.data())); if (!next) return false;
    await ref.set(next); return true;

  if (!ui.cr) { ui.cr = { me: ls("megadraft-name") || "", name: "", th: 19, ...DEFAULT_SETTINGS, bot: !!ui.practice }; ui.practice = false }
  const c = ui.cr, settings = { troops: c.troops, supers: Math.min(2, c.supers, c.troops), spells: c.spells, sieges: c.sieges, epics: c.epics, timer: c.timer };
  const size = autoSize(c.th, settings), prob = poolProblem(c.th, size, settings);
  const LIM = { troops: [1, 12, 1], supers: [0, Math.min(2, c.troops), 1], spells: [0, 8, 1], sieges: [0, 2, 1], epics: [0, 8, 1], timer: [0, 120, 5] };
  const step = (k, label, icon, cat, sub) => {
    const [lo, hi] = LIM[k], v = k === "supers" ? settings.supers : c[k];
    return `<div class="cr-step" style="--cc:var(--c-${cat})"><img src="icons/${icon}.webp" alt=""><div class="cr-lab"><b>${label}</b><small>${sub}</small></div>
      <div class="cr-ctl"><button type="button" data-st="${k}" data-d="-1" ${v <= lo ? "disabled" : ""} aria-label="Fewer ${label.toLowerCase()}">−</button><output aria-live="polite">${k === "timer" ? (v ? v + " s" : "Off") : v}</output><button type="button" data-st="${k}" data-d="1" ${v >= hi ? "disabled" : ""} aria-label="More ${label.toLowerCase()}">+</button></div></div>`;
  };
  const slots = (n, cat) => Array.from({ length: n }, () => `<i class="${cat}"></i>`).join("");
  const per = settings.troops + settings.spells + settings.sieges + settings.epics;
  const mins = c.timer ? Math.ceil(2 * per * c.timer / 60) : 0;
  app.innerHTML = `<div class="cr">
    <div class="row cr-top"><a href="#" class="small muted">← Back</a></div>
    <form id="cf" class="cr-grid" novalidate>
      <section class="panel cr-main">
        <div class="cr-head">${c.bot ? `<span class="tag ex">Practice</span>` : ""}<h2>${c.bot ? "Practice draft" : "Create room"}</h2></div>
        <p class="muted cr-lead">${c.bot ? "The bot takes the other seat and picks on its own. Same rules as a real draft." : "Set the rules, then send the room to your opponent. The pool is dealt once you're both ready."}</p>
        <div class="cr-names">
          <label class="f">Your in-game name<input id="c-me" required maxlength="24" value="${esc(c.me)}" autocomplete="nickname"></label>
          <label class="f">Room name<input id="c-name" maxlength="40" placeholder="${esc((c.me || "My") + "'s room")}" value="${esc(c.name)}"></label>
        </div>
        <div class="cr-sec"><h3>Town Hall</h3><div class="cr-th" role="radiogroup" aria-label="Town Hall">${TH_LEVELS.map(t => `<button type="button" role="radio" aria-checked="${t === c.th}" data-th="${t}" class="${t === c.th ? "on" : ""}">${t}</button>`).join("")}</div></div>
        <div class="cr-sec"><h3>Picks per player</h3><div class="cr-steps">
          ${step("troops", "Troops", "barbarian", "troop", "Regular and super")}
          ${step("supers", "Super troops", "super_barbarian", "super", "Most a player can take")}
          ${step("spells", "Spells", "rage_spell", "spell", "Any spell factory")}
          ${step("sieges", "Siege machines", "wall_wrecker", "siege", "Goes in the Clan Castle")}
          ${step("epics", "Epic equipment", "giant_gauntlet", "epic", "Max 2 per hero")}
          <div class="cr-step cr-timer" style="--cc:var(--hacc)"><span class="cr-clock" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M12 9v4l2.5 2M9.5 3h5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></span><div class="cr-lab"><b>Pick timer</b><small>Auto-pick at 0</small></div>
            <div class="cr-ctl"><button type="button" data-st="timer" data-d="-1" ${c.timer <= 0 ? "disabled" : ""} aria-label="Less time">−</button><output aria-live="polite">${c.timer ? c.timer + " s" : "Off"}</output><button type="button" data-st="timer" data-d="1" ${c.timer >= 120 ? "disabled" : ""} aria-label="More time">+</button></div></div>
        </div></div>
      </section>
      <aside class="cr-side">
        <div class="panel cr-sum">
          <h3>Each player's album</h3>
          <div class="cr-slots" aria-hidden="true">${slots(settings.troops - settings.supers, "troop")}${slots(settings.supers, "super")}${slots(settings.spells, "spell")}${slots(settings.sieges, "siege")}${slots(settings.epics, "epic")}</div>
          <p class="cr-big"><b>${per}</b> picks each · ${2 * per} in the draft</p>
          <p class="small muted">${c.timer ? `Up to about ${mins} min with the timer running out on every pick.` : "No timer: players pick at their own pace."} Up to ${settings.supers} of the ${settings.troops} troops can be super troops.</p>
          <h3 style="margin-top:14px">The shared pool</h3>
          <div class="cr-pool">${[["troop", size.troop, "troops"], ["super", size.super, "super troops"], ["spell", size.spell, "spells"], ["siege", size.siege, "siege machines"], ["epic", size.epic, "epics, max"]].map(([k, n, l]) => `<span style="--cc:var(--c-${k})"><b>${n}</b>${l}</span>`).join("")}</div>
          <p class="small muted">Only epics both players own are dealt. Heroes, pets and common equipment are free.</p>
          <div id="cerr" class="err" ${prob ? "" : "hidden"}>${esc(prob)}</div>
          <button class="primary cr-go" type="submit" ${prob ? "disabled" : ""}>${c.bot ? "Start practice" : "Create room"}</button>
        </div>
      </aside>
    </form></div>`;
  const me = document.getElementById("c-me"), nm = document.getElementById("c-name");
  me.oninput = () => { c.me = me.value; nm.placeholder = (c.me || "My") + "'s room" };
  nm.oninput = () => { c.name = nm.value };
  app.querySelectorAll("[data-th]").forEach(b => b.onclick = () => { c.th = +b.dataset.th; render(true) });
  app.querySelectorAll("[data-st]").forEach(b => b.onclick = () => {
    const k = b.dataset.st, [lo, hi, st] = LIM[k], cur = k === "supers" ? settings.supers : c[k];
    c[k] = Math.max(lo, Math.min(hi, cur + st * +b.dataset.d)); if (k === "troops") c.supers = Math.min(c.supers, c.troops, 2);
    render(true);
  });
  document.getElementById("cf").onsubmit = async e => {
    e.preventDefault();
    if (prob) { toast(prob); return }
    const name = c.me.trim(); if (!name) { me.focus(); toast("Enter your in-game name."); return }
    ls("megadraft-name", name);
    if (Store.live && !Store.uid) { toast("Sign in to Claude to create a room."); return }
    const bot = c.bot;
    const r = {
      v: 3, name: c.name.trim() || `${name}'s room`, th: c.th, createdAt: now(), hostUid: Store.uid,
      phase: "lobby", first: null, practice: bot,
      players: { A: { name, uid: Store.uid, lacks: myLacks(), ready: false }, B: bot ? { name: "Bot", uid: "bot", bot: true, lacks: [], ready: true } : null },
      settings, size, pool: [], picks: [], turnStart: null, paused: false, pausedLeft: null, rerolls: 0, reroll: null, results: { A: null, B: null }
    };
    try { const id = await Store.create(r); ui.cr = null; location.hash = "r-" + id } catch (err) { toast("Couldn't create the room. Check your connection and try again.") }
  };
}

/* ---------- admin ---------- */
// Signs in to a Firebase email/password account. The password is checked by Firebase, never stored in this page;
// firestore.rules let that account delete any room.
function renderAdmin() {
  const head = `<div class="row" style="margin-bottom:8px"><a href="#" class="small muted">← Back</a></div><h2>Admin</h2>`;
  if (Store.backend !== "firebase") { app.innerHTML = head + `<div class="note">The admin panel needs the room server. On this device you can already watch and delete every room.</div>`; return }
  if (!Store.isAdmin) {
    app.innerHTML = head + `<form id="af" class="panel stack" style="max-width:360px">
      <label class="f">Username<input id="a-user" autocomplete="username" required></label>
      <label class="f">Password<input id="a-pass" type="password" autocomplete="current-password" required></label>
      <div class="row"><button class="primary" type="submit">Sign in</button></div><div id="aerr" class="err" hidden></div></form>`;
    document.getElementById("af").onsubmit = async e => {
      e.preventDefault();
      const er = document.getElementById("aerr");
      try { await Store.adminLogin(document.getElementById("a-user").value, document.getElementById("a-pass").value); render(true) }
      catch (err) { er.textContent = "Wrong username or password."; er.hidden = false }
    };
    return;
  }
  const all = Object.entries(Store.rooms).sort((a, b) => (b[1].createdAt || 0) - (a[1].createdAt || 0));
  const age = r => { const m = Math.round((now() - (r.createdAt || 0)) / 60000); return m < 60 ? m + " min" : m < 1440 ? Math.round(m / 60) + " h" : Math.round(m / 1440) + " d" };
  app.innerHTML = head + `
    <div class="row" style="margin-bottom:12px"><span class="muted small">Signed in as admin · ${all.length} room${all.length === 1 ? "" : "s"}</span><span class="spacer"></span>
      ${all.some(([, r]) => now() - (r.createdAt || 0) > ROOM_MAX_AGE) ? `<button type="button" class="danger" id="a-old">Delete rooms older than a day</button>` : ""}<button type="button" id="a-out">Sign out</button></div>
    <div class="list">${all.length ? all.map(([id, r]) => `<div class="mrow"><span class="th">TH${r.th}</span><strong>${esc(r.name)}</strong>
      <span class="small"><span class="seatA">${esc(r.players?.A?.name)}</span>${r.players?.B ? ` vs <span class="seatB">${esc(r.players.B.name)}</span>` : ""}</span><span class="spacer"></span>
      <span class="muted small">${age(r)} ago</span><span class="pill ${r.phase}">${phaseLabel(r.phase)}</span>
      <a class="btn" href="#r-${id}">Watch</a><button type="button" class="danger" data-adel="${id}">Delete</button></div>`).join("") : `<div class="note">No rooms.</div>`}</div>`;
  app.querySelectorAll("[data-adel]").forEach(b => b.onclick = () => confirmInline(b, "Sure?", async () => { try { await Store.remove(b.dataset.adel); toast("Room deleted.") } catch (e) { toast("Couldn't delete. Check the Firestore rules.") } }));
  const old = document.getElementById("a-old");
  if (old) old.onclick = () => confirmInline(old, "Delete all old rooms?", async () => {
    const ids = all.filter(([, r]) => now() - (r.createdAt || 0) > ROOM_MAX_AGE).map(([id]) => id);
    let n = 0; for (const id of ids) { try { await Store.remove(id); n++ } catch (e) { } }
    toast(`Deleted ${n} of ${ids.length} old rooms.`);
  });
  document.getElementById("a-out").onclick = async () => { await Store.adminLogout(); location.hash = "" };
}

  const all = roomsList();
  const f = ui.thFilter;
  const match = ([, r]) => f === "all" || String(r.th) === f;
  const open = all.filter(([, r]) => r.phase === "lobby" && !r.players.B).filter(match);

    <h3>Waiting for an opponent</h3>
    <div class="list" style="margin-bottom:16px">${open.length ? open.map(e => roomRow(e, "Join")).join("") : `<div class="note">No open rooms${f === "all" ? "" : " at TH" + f}. <a href="#create">Create one</a>.</div>`}</div>
