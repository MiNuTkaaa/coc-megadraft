/* ---------- room ---------- */
function renderRoom(id) {
  const r = Store.rooms[id];
  if (!r) { app.innerHTML = Store.loaded ? `<div class="note">This room no longer exists. <a href="#join">Find another room</a>.</div>` : `<p class="muted">Loading room…</p>`; return }
  const steps = ["lobby", "draft", "attack", "done"].map(p => `<span class="${r.phase === p ? "on" : ""}">${phaseLabel(p)}</span>`).join("");
  const canDelete = (isHost(r) && r.phase === "lobby") || isMod() || Store.isAdmin;
  let body = r.phase === "lobby" ? lobbyView(id, r) : r.phase === "draft" ? draftView(id, r) : attackView(id, r);
  app.innerHTML = `
    <div class="row" style="margin-bottom:8px"><a href="#" class="small muted">← All rooms</a><span class="spacer"></span>
      <button type="button" class="linkbtn" data-copylink="${id}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4.5 4.5 0 0 0 6.4 0l3.2-3.2a4.5 4.5 0 0 0-6.4-6.4L12 5.6M14 10a4.5 4.5 0 0 0-6.4 0l-3.2 3.2a4.5 4.5 0 0 0 6.4 6.4l1.2-1.2" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>Copy room link</button>
      ${canDelete ? `<button type="button" class="danger" id="del">Delete room</button>` : ""}</div>
    <div class="row" style="margin-bottom:10px"><span class="th">TH${r.th}</span><h2 style="margin:0">${esc(r.name)}</h2></div>
    <div class="steps">${steps}</div>
    ${body}`;
  app.querySelectorAll("[data-copylink]").forEach(b => b.onclick = () => copyText(roomLink(id), "Room link copied. Anyone who opens it lands in this room."));
  const del = document.getElementById("del");
  if (del) del.onclick = () => confirmInline(del, "Delete for everyone?", async () => { await Store.remove(id); location.hash = "" });
  if (r.phase === "lobby") bindLobby(id, r);
  else if (r.phase === "draft") bindDraft(id, r);
  else bindAttack(id, r);
}
function confirmInline(btn, label, fn) {
  const old = btn.textContent; btn.textContent = label; btn.classList.add("primary");
  btn.onclick = async () => { await fn() };
  setTimeout(() => { if (btn.isConnected) { btn.textContent = old; btn.classList.remove("primary"); btn.onclick = () => confirmInline(btn, label, fn) } }, 4000);
}
function poolGrid(r, seat, interactive) {
  const takenBy = {}; r.picks.forEach(p => takenBy[p.id] = p.seat);
  const q = ui.q.toLowerCase();
  const items = r.pool.map(id => BYID[id]).filter(Boolean).filter(it => (ui.tab === "all" || it.c === ui.tab) && (!q || it.n.toLowerCase().includes(q)));
  const tile = it => {
    const t = takenBy[it.id], why = t || !seat ? "" : whyIllegal(r, seat, it);
    const cls = ["tile", t ? "taken" + t : "", why ? "blocked" : "", ui.sel === it.id ? "sel" : ""].join(" ");
    const title = t ? `Taken by ${r.players[t].name}` : why || it.n;
    return `<button type="button" class="${cls}" style="--cc:var(--c-${it.c})" data-pick="${it.id}" title="${esc(title)}" ${interactive ? "" : "tabindex=\"-1\""}>
      ${it.c === "epic" ? `<img class="herotag" src="${HEROES[it.h].img}" alt="${esc(HEROES[it.h].n)}">` : ""}${t ? `<span class="own seat${t}">${t}</span>` : ""}
      ${img(it)}<span>${esc(it.n)}</span>${it.hs ? `<span class="hs">${it.hs} space</span>` : it.c === "epic" ? `<span class="hs">${esc(HEROES[it.h].n)}</span>` : ""}</button>`;
  };
  let grid = "";
  if (ui.tab === "all") for (const c of CATS) { const arr = items.filter(it => it.c === c.k); if (arr.length) grid += `<div class="sectionlab">${c.label} · ${arr.length}</div>` + arr.map(tile).join("") }
  else grid = items.map(tile).join("");
  return `<div class="row" style="margin-bottom:10px">
      <div class="chips">${[{ k: "all", label: "All" }, ...CATS].map(c => `<button type="button" data-tab="${c.k}" class="${ui.tab === c.k ? "on" : ""}">${c.label}</button>`).join("")}</div>
      <span class="spacer"></span><input id="q" placeholder="Search" value="${esc(ui.q)}" style="width:150px" aria-label="Search the pool">
    </div><div class="pool">${grid || `<div class="muted">Nothing matches.</div>`}</div>`;
}
function bindPoolControls() {
  app.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { ui.tab = b.dataset.tab; render(true) });
  const q = document.getElementById("q");
  if (q) q.oninput = () => { ui.q = q.value; const pos = q.selectionStart; render(true); const n = document.getElementById("q"); n.focus(); n.setSelectionRange(pos, pos) };
}
function freeLine(r) {
  const hs = Object.entries(HEROES).filter(([, h]) => h.th <= r.th);
  return `<div class="row small muted"><span>Free for both:</span><span class="heroes">${hs.map(([, h]) => `<img src="${h.img}" alt="${esc(h.n)}" title="${esc(h.n)}">`).join("")}</span><span>all heroes (bring 4), pets and common equipment</span></div>`;
}

function rulesHTML(r) {
  const st = r.settings, m = minsOf(st), card = (h, d, c = "") => `<div class="rcard"${c ? ` style="--cc:var(--c-${c})"` : ""}><b>${h}</b><span>${d}</span></div>`;
  return `<div class="rcards">
    ${card("Snake draft", `Coin flip for first pick, then two picks each in turn. You get ${PREVIEW_MS / 1000} s to study the pool first.`)}
    ${card("What you draft", `${st.troops} troops (max ${st.supers} super), ${st.spells} spells, ${st.sieges} siege and ${st.epics} epics (max ${EPICS_PER_HERO} per hero).`, "troop")}
    ${card("Your picks, your army", "Attack only with what you drafted, Clan Castle included. You don't have to use all of it.", "super")}
    ${card("Free for everyone", "All heroes, pets and common equipment.")}
    ${card("Epic race", "Only epics you both own are dealt. Run out of ones you can take, and each empty epic slot becomes a flex pick: one more troop or spell.", "epic")}
    ${card("Timer", st.timer ? `${st.timer} s per pick. Run out and a random legal item is picked for you, marked *.` : "None in this room.", "spell")}
    ${card("New pool", `Either player can ask, the other must accept. Up to ${MAX_REROLLS} per room.`)}
    ${card("Finish early", `Once you have ${m.troops} troops, ${m.spells} spells, ${m.sieges} siege and ${m.epics} epics, you can skip your remaining turns.`)}
    ${card("Build your army", `${ARMY_MS / 60000} minutes after the draft, then copy the link into the game.`, "siege")}
    ${card("Winner", "Most stars, then destruction %, then time left.")}
  </div>`;
}
const myLacks = () => { try { return JSON.parse(ls("megadraft-lacks") || "[]") } catch (e) { return [] } };
function lacksPicker(prefix, selected) {
  const by = {}; EPICS.forEach(e => (by[e.h] = by[e.h] || []).push(e));
  return `<div class="lacks">${Object.entries(by).map(([h, arr]) => `<div class="hg"><div><img src="${HEROES[h].img}" alt="">${esc(HEROES[h].n)}</div>
    ${arr.map(e => `<label><input type="checkbox" data-${prefix}="${e.id}" ${selected.includes(e.id) ? "checked" : ""}>${img(e, "")}${esc(e.n)}</label>`).join("")}</div>`).join("")}</div>`;
}
const readLacks = prefix => [...app.querySelectorAll(`[data-${prefix}]`)].filter(c => c.checked).map(c => c.getAttribute("data-" + prefix));
const lacksLine = p => p?.lacks?.length ? `<div class="small muted" style="margin-top:4px">Doesn't own: ${p.lacks.map(id => esc(BYID[id]?.n || id)).join(", ")}</div>` : "";

function lobbyView(id, r) {
  const A = r.players.A, B = r.players.B, me = mySeats(r);
  const seated = me.length > 0;
  const joinBox = !B && !(Store.live && seated) ? `
    <form id="jf" class="row"><label class="f">Your in-game name<input id="j-me" required maxlength="24" value="${esc(ls("megadraft-name") || "")}"></label>
    <button class="primary" type="submit" style="align-self:flex-end">Join as opponent</button></form>` : "";
  const status = p => p.ready ? `<span class="pill attack">Ready</span>` : `<span class="pill">Not ready</span>`;
  const card = s => {
    const p = r.players[s];
    if (!p) return `<section class="panel roster B"><div class="head"><span class="name seatB">Open seat</span></div>${joinBox || (seated ? `<div class="invite"><div class="small muted">Send your opponent this link. It opens straight into this room.</div><div class="row"><input readonly class="linkbox" value="${esc(roomLink(id))}" aria-label="Room link" onfocus="this.select()"><button type="button" class="primary" data-copylink="${id}">Copy link</button></div></div>` : `<div class="small muted">Waiting for someone to join.</div>`)}</section>`;
    const kick = s === "B" && (isHost(r) || canActFor(r, "B")) ? `<button type="button" id="leaveB">${canActFor(r, "B") && !isHost(r) ? "Leave" : "Remove"}</button>` : "";
    return `<section class="panel roster ${s}"><div class="head"><span class="name seat${s}">${esc(p.name)}</span>${s === "A" ? `<span class="pill">Host</span>` : ""}${p.bot ? `<span class="pill">Bot</span>` : ""}<span class="spacer"></span>${status(p)}${kick}</div>${lacksLine(p)}</section>`;
  };
  // each seat on this device that isn't ready yet: rules, epics you don't own, Ready
  const setup = me.filter(s => r.players[s] && !r.players[s].bot).map(s => {
    const p = r.players[s], who = Store.live ? "you don't" : esc(p.name) + " doesn't";
    if (p.ready) return `<div class="panel row" style="margin-bottom:12px"><span>${Store.live ? "You're" : esc(p.name) + " is"} ready. ${r.players[other(s)]?.ready ? "" : "Waiting for the other player."}</span><span class="spacer"></span><button type="button" data-unready="${s}">Not ready</button></div>`;
    return `<section class="panel stack" style="margin-bottom:12px">
      ${Store.live ? "" : `<h3 style="margin:0" class="seat${s}">${esc(p.name)}</h3>`}
      <div class="rules"><h3 style="margin:0">Rules</h3>${rulesHTML(r)}</div>
      <div><h3 style="margin:0">Epic equipment ${who} have</h3><p class="small muted" style="margin:4px 0 0">Tick everything ${Store.live ? "you haven't" : "not"} unlocked. Only epics both players own go in the pool.</p>${lacksPicker("lk" + s, p.lacks || [])}</div>
      <div class="row"><button type="button" class="primary" data-ready="${s}">Ready</button><span class="small muted">The draft starts as soon as both players are ready.</span></div>
    </section>`;
  }).join("");
  return `
    <div class="grid2" style="margin-bottom:12px">${card("A")}${card("B")}</div>
    ${setup}
    ${!seated ? `<div class="panel stack"><div class="rules"><h3 style="margin:0">Rules</h3>${rulesHTML(r)}</div>${freeLine(r)}</div>` : ""}`;
}
function bindLobby(id, r) {
  const jf = document.getElementById("jf");

    const ok = await Store.mutate(id, x => { if (x.phase !== "lobby" || x.players.B) return null; x.players.B = { name: me, uid: Store.uid, lacks: myLacks(), ready: false }; return x }).catch(() => false);

  return [["Troops", troops, st.troops, `${supers}/${st.supers} super`], ["Spells", mine.filter(i => i.c === "spell"), st.spells], ["Siege", mine.filter(i => i.c === "siege"), st.sieges], ["Epic equip.", mine.filter(i => i.c === "epic"), st.epics]]
    .filter(g => g[2] > 0).map(([lab, arr, cap, extra]) => `<div class="cat"><div class="lab">${lab}<br><span class="mono">${arr.length}/${cap}</span>${extra ? `<br>${extra}` : ""}</div><div class="slots">${arr.map(chip).join("")}${r.phase !== "draft" || r.done?.[seat] ? "" : lab.startsWith("Epic") && fx.on ? flexes(fx.left) : empties(Math.max(0, cap - arr.length))}</div></div>`).join("");
}

/* ---------- army builder ---------- */
// In-game "copy army" link. Sections: h heroes, i CC troops, d CC spells, u troops (siege included), s spells.
function armyLink(a) {
  const sec = [];
  const hs = a.heroes.filter(h => h && h.h && HEROES[h.h]).map(h => {
    let s = "" + HEROES[h.h].aid;
    if (h.pet && PETBY[h.pet]) s += "p" + PETBY[h.pet].aid;
    const e = (h.eq || []).filter(id => EQUIP[id]).map(id => EQUIP[id].aid);
    if (e.length) s += "e" + e.join("_");
    return s;
  });
  if (hs.length) sec.push("h" + hs.join("-"));

  return "https://link.clashofclans.com/en?action=CopyArmy&army=" + sec.join("");
}

    epicIds = EPICS.filter(e => !myLacks().includes(e.id)).map(e => e.id);
    key = `megadraft-army-th${th}`; title = "Army builder"; back = "#";
  }
  const cap = CAP[th] || CAP[18];

  const heroList = Object.entries(HEROES).filter(([, h]) => h.th <= th).map(([k]) => k);
  if (!a) a = { u: {}, s: {}, cc: { u: {}, s: {} }, heroes: heroList.slice(0, 4).map(h => ({ h, pet: "", eq: ["", ""] })) };
  // 4 fixed hero slots (null = empty)

  const tab = ui.btab || "army";
  const save = () => { ls(key, JSON.stringify(a)); renderBuilder(ctx) };
  // buckets: army troops+siege (u), army spells (s), CC troops+siege (cu), CC spells (cs)
  const get = b => b === "u" ? a.u : b === "s" ? a.s : b === "cu" ? a.cc.u : a.cc.s;
  const room = { u: cap[0] - space(a.u), s: cap[1] - space(a.s), cu: cap[2] - space(a.cc.u), cs: cap[3] - space(a.cc.s), gu: 1 - space(a.u, true), gcu: cap[4] - space(a.cc.u, true) };
  const fits = (b, it) => it.c === "siege" ? room["g" + b] >= 1 : room[b] >= (it.hs || 1);
  const kind = it => it.c === "spell" ? "spell" : it.c === "siege" ? "siege" : "";
  const fixed = it => ctx && it.c === "siege";
  const unit = (b, it, n, add) => !add && fixed(it) ? `<span class="unit siege fixed" style="--cc:var(--c-siege)" title="${esc(it.n)} · your drafted siege machine, always in the Clan Castle">${img(it, "")}<span class="cnt">x${n}</span></span>`
    : `<button type="button" class="unit ${kind(it)}" style="--cc:var(--c-${it.c})" data-${add ? "add" : "rem"}="${b}|${it.id}" ${add && !fits(b, it) ? "disabled" : ""} title="${esc(it.n)}${add ? "" : " · tap to remove one"}">${img(it, "")}${n ? `<span class="cnt">x${n}</span>` : ""}${add && it.c !== "siege" ? `<span class="sp">${it.hs || 1}</span>` : ""}</button>`;
  const tray = (bs) => { const out = bs.flatMap(b => Object.entries(get(b)).filter(([id, n]) => n > 0 && BYID[id]).map(([id, n]) => unit(b, BYID[id], n, false))); return out.length ? out.join("") : `<span class="empty">Tap a unit below to add it.</span>` };
  const capbar = (lab, used, max) => `<div class="capbar ${used >= max ? "full" : ""}"><span style="min-width:92px">${lab}</span><span class="bar"><i style="width:${max ? Math.min(100, 100 * used / max) : 0}%"></i></span><span>${used}/${max}</span></div>`;
  const cc = tab === "cc", tb = cc ? "cu" : "u", sb = cc ? "cs" : "s";
  const usedT = cc ? space(a.cc.u) : space(a.u), usedS = cc ? space(a.cc.s) : space(a.s), usedG = cc ? space(a.cc.u, true) : space(a.u, true);
  // hero slots: tap an empty slot to pick a hero; tap a filled one for pet, equipment or a different hero
  const hs = ui.hslot ?? -1, cur = a.heroes[hs];
  const usedPets = a.heroes.filter((h, i) => h && i !== hs).map(h => h.pet).filter(Boolean);
  const slot = (h, i) => {
    if (!h) return `<button type="button" class="hslot ${hs === i ? "on" : ""}" data-hslot="${i}"><span class="plus">+</span><span class="hn2 muted">Add hero</span></button>`;
    const H = HEROES[h.h], pet = PETBY[h.pet];
    return `<button type="button" class="hslot ${hs === i ? "on" : ""}" data-hslot="${i}"><img class="hb" src="${H.img}" alt=""><span class="hn2">${esc(H.n)}</span>
      <span class="gear">${pet ? `<img src="${pet.img}" alt="" title="${esc(pet.n)}">` : `<span title="No pet"></span>`}${[0, 1].map(k => EQUIP[h.eq[k]] ? `<img src="${EQUIP[h.eq[k]].img}" alt="" title="${esc(EQUIP[h.eq[k]].n)}">` : `<span title="No equipment"></span>`).join("")}</span></button>`;
  };
  let panel = "";
  if (hs >= 0) {
    const taken = a.heroes.filter((h, i) => h && i !== hs).map(h => h.h);
    const heroBtn = k => `<button type="button" class="ico ${cur?.h === k ? "on" : ""}" data-pickhero="${k}" ${taken.includes(k) ? "disabled title=\"Already in another slot\"" : ""}><img src="${HEROES[k].img}" alt="">${esc(HEROES[k].n)}</button>`;
    if (!cur) {
      panel = `<div class="hpanel"><div class="row"><b>Choose a hero</b><span class="spacer"></span><button type="button" id="h-close">Close</button></div><div class="herogrid">${heroList.map(heroBtn).join("")}</div></div>`;
    } else {
      const eqs = [...COMMONS.filter(c => c.h === cur.h && c.th <= th), ...epicIds.map(id => EQUIP[id]).filter(e => e && e.h === cur.h)];
      const pets = PETS.filter(p => p.th <= th);
      panel = `<div class="hpanel">
        <div class="row"><b>${esc(HEROES[cur.h].n)}</b><span class="spacer"></span><button type="button" id="h-remove">Remove</button><button type="button" class="primary" id="h-close">Done</button></div>
        <div class="lab" style="margin-top:10px">Hero · tap another to swap</div>
        <div class="icogrid">${heroList.filter(k => !taken.includes(k)).map(heroBtn).join("")}</div>
        <div class="lab" style="margin-top:10px">Equipment · pick 2 (${cur.eq.filter(Boolean).length}/2)</div>
        <div class="icogrid">${eqs.map(e => { const on = cur.eq.includes(e.id); return `<button type="button" class="ico ${on ? "on" : ""} ${BYID[e.id] ? "epic" : ""}" data-pickeq="${e.id}" ${!on && cur.eq.filter(Boolean).length >= 2 ? "disabled" : ""}><img src="${e.img}" alt="">${esc(e.n)}</button>` }).join("")}</div>
        <div class="lab">Pet</div>
        <div class="icogrid"><button type="button" class="ico ${!cur.pet ? "on" : ""}" data-pickpet=""><span style="width:44px;height:44px;display:grid;place-items:center;font-size:22px">∅</span>No pet</button>${pets.map(pt => `<button type="button" class="ico ${cur.pet === pt.id ? "on" : ""}" data-pickpet="${pt.id}" ${usedPets.includes(pt.id) ? "disabled title=\"Used by another hero\"" : ""}><img src="${pt.img}" alt="">${esc(pt.n)}</button>`).join("")}</div>
      </div>`;
    }
  }
  const link = armyLink(a);
  const empty = !Object.values(a.u).some(n => n > 0) && !Object.values(a.s).some(n => n > 0);
  const ttl = ctx ? `<span class="th">TH${th}</span><h2 style="margin:0">${title}</h2><span class="muted small">${esc(r.name)}</span>`
    : `<h2 style="margin:0">${title}</h2><label class="f" style="width:120px">Town Hall<select id="b-th">${TH_LEVELS.map(x => `<option ${x === th ? "selected" : ""}>${x}</option>`).join("")}</select></label>`;
  const locked = !!(ctx && r.armyUntil && now() >= r.armyUntil);
  app.innerHTML = `<div id="builder" ${locked ? `data-locked="1"` : ""}>
    <div class="row" style="margin-bottom:8px"><a href="${back}" class="small muted">← Back</a></div>
    <div class="row" style="margin-bottom:12px">${ttl}</div>
    ${ctx && r.armyUntil ? (locked ? `<div class="status" style="border-color:var(--bad)"><b>Time's up.</b><span class="small muted">The army is locked. Copy the link below into the game.</span></div>`
      : `<div class="status" style="border-color:var(--accent)"><b>Time to build</b><span class="clock js-armyclock">${fmt(r.armyUntil - now())}</span><span class="small muted">The builder locks when this reaches 0.</span></div>`) : ""}
    <section class="army">
      <div class="tabs"><button type="button" data-btab="army" class="${cc ? "" : "on"}">Army</button><button type="button" data-btab="cc" class="${cc ? "on" : ""}">Clan Castle</button><span class="spacer"></span><button type="button" id="b-clear">Clear ${cc ? "Clan Castle" : "army"}</button></div>
      ${capbar(cc ? "CC troops" : "Troops", usedT, cc ? cap[2] : cap[0])}
      <div class="tray">${tray([tb])}</div>
      ${capbar(cc ? "CC spells" : "Spells", usedS, cc ? cap[3] : cap[1])}
      <div class="tray">${tray([sb])}</div>
      <div class="lab">Troops${ctx ? " you drafted" : ""}</div>
      <div class="train">${troops.filter(i => i.c === "troop").map(it => unit(tb, it, 0, true)).join("") || `<span class="empty">None drafted.</span>`}</div>
      ${troops.some(i => i.c === "super") ? `<div class="lab">Super troops</div><div class="train">${troops.filter(i => i.c === "super").map(it => unit(tb, it, 0, true)).join("")}</div>` : ""}
      ${cc ? (ctx ? (sieges.length ? `<div class="lab">Siege machine · added automatically</div>` : "") : `<div class="lab">Siege machines · ${usedG}/${cap[4]}</div><div class="train">${sieges.map(it => unit("cu", it, 0, true)).join("")}</div>`)
        : `<div class="lab">Siege machine · goes in the Clan Castle</div>`}
      <div class="lab">Spells${ctx ? " you drafted" : ""}</div>
      <div class="train">${spells.map(it => unit(sb, it, 0, true)).join("") || `<span class="empty">None drafted.</span>`}</div>
    </section>
    <section class="panel" style="margin-bottom:12px"><h3>Heroes <span class="muted small">· tap a slot</span></h3><div class="hslots">${a.heroes.map(slot).join("")}</div>${panel}</section>
    <section class="panel stack" style="margin-bottom:12px">
      <b>In-game link</b>
      <input class="linkbox" id="b-link" readonly value="${esc(link)}" aria-label="Army link">
      <div class="row"><button type="button" class="primary" id="b-copy" ${empty ? "disabled" : ""}>Copy link</button><a class="btn" href="${esc(link)}" target="_blank" rel="noopener" ${empty ? `aria-disabled="true" style="pointer-events:none;opacity:.45"` : ""}>Open in Clash of Clans</a>
        <span class="small muted">Open the link on the phone that has the game, then tap Okay to copy the army.</span></div>
    </section>
  </div>`;
  if (locked) { app.querySelectorAll("#builder .army button, #builder .hslots button, #builder .hpanel button").forEach(b => b.disabled = true); ui.hslot = -1 }
  app.querySelectorAll("[data-add]").forEach(b => b.onclick = () => { const [bk, id] = b.dataset.add.split("|"), it = BYID[id]; if (!fits(bk, it)) return; const o = get(bk); o[id] = (o[id] || 0) + 1; save() });
  app.querySelectorAll("[data-rem]").forEach(b => b.onclick = () => { const [bk, id] = b.dataset.rem.split("|"), o = get(bk); o[id] = (o[id] || 0) - 1; if (o[id] <= 0) delete o[id]; save() });
  app.querySelectorAll("[data-btab]").forEach(b => b.onclick = () => { ui.btab = b.dataset.btab; renderBuilder(ctx) });
  app.querySelectorAll("[data-hslot]").forEach(b => b.onclick = () => { const i = +b.dataset.hslot; ui.hslot = ui.hslot === i ? -1 : i; ui.hpick = false; renderBuilder(ctx) });
  app.querySelectorAll("[data-pickhero]").forEach(b => b.onclick = () => { const k = b.dataset.pickhero; if (a.heroes[hs]?.h !== k) a.heroes[hs] = { h: k, pet: a.heroes[hs]?.pet || "", eq: ["", ""] }; ui.hpick = false; save() });
  app.querySelectorAll("[data-pickeq]").forEach(b => b.onclick = () => { const id = b.dataset.pickeq, eq = cur.eq; const k = eq.indexOf(id); if (k >= 0) eq[k] = ""; else { const f = eq.indexOf(""); if (f >= 0) eq[f] = id } save() });
  app.querySelectorAll("[data-pickpet]").forEach(b => b.onclick = () => { cur.pet = b.dataset.pickpet; save() });
  const hr = document.getElementById("h-remove"); if (hr) hr.onclick = () => { a.heroes[hs] = null; ui.hslot = -1; save() };
  const hx = document.getElementById("h-close"); if (hx) hx.onclick = () => { ui.hslot = -1; ui.hpick = false; renderBuilder(ctx) };
  document.getElementById("b-clear").onclick = () => { if (cc) a.cc = { u: {}, s: {} }; else { a.u = {}; a.s = {} } save() };  // drafted siege comes back on save
  document.getElementById("b-copy").onclick = async () => { try { await navigator.clipboard.writeText(link); toast("Link copied.") } catch (e) { const l = document.getElementById("b-link"); l.select(); toast("Copy is blocked here. The link is selected, copy it by hand.") } };
  const bth = document.getElementById("b-th"); if (bth) bth.onchange = () => { ls("megadraft-bth", bth.value); renderBuilder(null) };
}

/* ---------- practice bot ---------- */
// Fills its emptiest category first, prefers bigger troops, and sometimes takes what the other player could still use.
function botChoice(r, legal) {
  const seat = turnSeat(r), st = r.settings, c = counts(r, seat);
  const need = { troop: st.troops - c.troop - c.super, spell: st.spells - c.spell, siege: st.sieges - c.siege, epic: st.epics - c.epic };
  const score = it => {
    const cat = it.c === "super" ? "troop" : it.c;
    let s = need[cat] * 10 + Math.random() * 12;
    if (it.hs) s += Math.min(it.hs, 30) / 6;
    if (it.c === "super") s += 3;
    return s;
  };
  return legal.slice().sort((a, b) => score(b) - score(a))[0];
}

/* ---------- timer + auto-pick ---------- */
const autoTried = {}, seenAt = {};
function fmt(ms) { const s = Math.ceil(ms / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}` }
// army-building countdown (room page and builder)
setInterval(() => {
  const rt = route(); if (rt.v !== "room" && rt.v !== "army") return;
  const r = Store.rooms[rt.id]; if (!r || !r.armyUntil || r.phase === "draft" || r.phase === "lobby") return;
  const left = r.armyUntil - now();
  document.querySelectorAll(".js-armyclock").forEach(c => c.textContent = left > 0 ? fmt(left) : "0:00");
  if (left <= 0 && rt.v === "army" && document.getElementById("builder") && !document.getElementById("builder").dataset.locked) renderBuilder(rt);
}, 500);
setInterval(() => {
  const rt = route(); if (rt.v !== "room") return;
  const r = Store.rooms[rt.id]; if (!r || r.phase !== "draft") return;
  document.querySelectorAll(".js-clock").forEach(c => {
    const big = c.classList.contains("dclock") ? "dclock" : "clock", d = deadline(r);
    c.textContent = clockText(r); c.className = big + " js-clock" + (!inPreview(r) && d && d - now() < 6000 ? " low" : "");
  });
  // re-render once when the preview ends so Lock in becomes available
  if (r.previewUntil && ui.pvDone !== rt.id + r.previewUntil && now() >= r.previewUntil) { ui.pvDone = rt.id + r.previewUntil; render() }
  const i = r.picks.length, k = curSlot(r), seat = turnSeat(r); if (!seat) return;
  // practice bot: the host's device picks for it after a short pause
  if (r.players[seat]?.bot && isHost(r) && !r.paused && r.turnStart && now() - r.turnStart >= 1200) {
    const bk = rt.id + ":bot:" + i + ":" + k;
    if (!autoTried[bk]) {
      autoTried[bk] = true;
      Store.mutate(rt.id, x => {
        if (x.phase !== "draft" || x.picks.length !== i || curSlot(x) !== k || x.paused) return null;
        const legal = legalItems(x, turnSeat(x)); if (!legal.length) return finishStuck(x, turnSeat(x));
        return applyPick(x, botChoice(x, legal).id, false);
      }).catch(() => { autoTried[bk] = false });
    }
    return;
  }
  const d = deadline(r); if (!d) return;
  const late = now() - d;
  // safety net against a wrong clock: this device never auto-picks before it has watched this turn for the whole timer itself
  const seenKey = rt.id + ":" + i + ":" + k + ":" + r.turnStart;
  if (!seenAt[seenKey]) seenAt[seenKey] = performance.now();
  if (performance.now() - seenAt[seenKey] < r.settings.timer * 1000 - 400) return;
  // the picker's own device auto-picks first; the opponent's device covers after 3 s, any viewer after 8 s
  const due = mySeats(r).includes(seat) ? late >= 0 : mySeats(r).length ? late >= 3000 : late >= 8000;
  const key = rt.id + ":" + i + ":" + k;
  if (!due || autoTried[key]) return;
  if (Store.live && !Store.uid) return;
  autoTried[key] = true;
  Store.mutate(rt.id, x => {
    if (x.phase !== "draft" || x.picks.length !== i || curSlot(x) !== k || x.paused) return null;
    const dl = deadline(x); if (!dl || now() < dl) return null;
    const legal = legalItems(x, turnSeat(x)); if (!legal.length) return finishStuck(x, turnSeat(x));
    return applyPick(x, legal[Math.floor(Math.random() * legal.length)].id, true);
  }).catch(() => { autoTried[key] = false });
}, 250);

Store.listeners.push(() => {
  const v = route().v;
  // these pages don't depend on live room changes, and a re-render would wipe what you typed
  if ((v === "admin" && !Store.isAdmin) || v === "create" || v === "builder" || (v === "army" && document.getElementById("builder"))) return;
  render();
});
Promise.all([syncClock(), Store.init()]).then(() => render(true));
</script>
