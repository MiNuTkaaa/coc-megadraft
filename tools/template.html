<!doctype html>
<html lang="en">

<style>
/* Layout: lobby (create / join with Town Hall filter) -> room: status bar, two rosters, shared pool grid, sticky lock-in bar. */
:root {
  --bg: #eef1f4; --panel: #ffffff; --panel2: #e3e8ee; --fg: #17202b; --muted: #5b6878;

  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Inter", system-ui, -apple-system, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12161c; --panel: #1b2129; --panel2: #232b35; --fg: #e8edf3; --muted: #95a2b3;
  --line: #2e3844; --accent: #f07a42; --accent-fg: #1a0d05;
  --a: #6aa8ff; --a-soft: #1c2e4a; --b: #f07ac0; --b-soft: #45203a;
  --ok: #4fc483; --warn: #e3a63a; --bad: #ff7a70; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #12161c; --panel: #1b2129; --panel2: #232b35; --fg: #e8edf3; --muted: #95a2b3;
  --line: #2e3844; --accent: #f07a42; --accent-fg: #1a0d05;
  --a: #6aa8ff; --a-soft: #1c2e4a; --b: #f07ac0; --b-soft: #45203a;
  --ok: #4fc483; --warn: #e3a63a; --bad: #ff7a70; color-scheme: dark }
* { box-sizing: border-box }
[hidden] { display: none !important }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 14px; line-height: 1.45 }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px 110px }
header.top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px }
header.top h1 { font-family: var(--display); font-weight: 800; font-size: 22px; margin: 0; letter-spacing: -.01em }
header.top h1 a { color: inherit; text-decoration: none }
.mode { font-size: 12px; padding: 3px 8px; border-radius: 99px; background: var(--panel2); color: var(--muted) }
.mode.live { color: var(--ok) }
.spacer { flex: 1 }
h2 { font-family: var(--display); font-weight: 600; font-size: 18px; margin: 0 0 10px; text-wrap: balance }
h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 8px; font-weight: 600 }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px }
@media (max-width: 720px) { .grid2 { grid-template-columns: 1fr } }
.stack { display: flex; flex-direction: column; gap: 12px }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap }
button, .btn { font: inherit; font-weight: 600; border: 1px solid var(--line); background: var(--panel2); color: var(--fg); padding: 8px 12px; border-radius: 8px; cursor: pointer; text-decoration: none; display: inline-block }
button:hover, .btn:hover { border-color: var(--muted) }
.primary { background: var(--accent) !important; border-color: var(--accent) !important; color: var(--accent-fg) !important }
button.danger { color: var(--bad) }
button:disabled { opacity: .45; cursor: not-allowed }
button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
input, select { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 7px 9px; min-width: 0 }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); min-width: 0 }
.muted { color: var(--muted) } .small { font-size: 12px }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums }
.list { display: flex; flex-direction: column; gap: 6px }
.mrow { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: inherit; flex-wrap: wrap; text-decoration: none }
.mrow:hover { border-color: var(--muted) }
.pill { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: var(--panel2); color: var(--muted); text-transform: uppercase; letter-spacing: .05em; white-space: nowrap }
.pill.lobby { color: var(--ok) } .pill.draft { color: var(--accent) } .pill.attack { color: var(--warn) }
.th { font-family: var(--mono); font-size: 12px; font-weight: 500; padding: 2px 7px; border-radius: 6px; background: var(--fg); color: var(--bg); white-space: nowrap }
.seatA { color: var(--a) } .seatB { color: var(--b) }
.hero { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 18px }
@media (max-width: 560px) { .hero { grid-template-columns: 1fr } }
.bigbtn { display: flex; flex-direction: column; gap: 4px; padding: 18px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); text-decoration: none }
.bigbtn b { font-family: var(--display); font-size: 22px; font-weight: 800 }
.bigbtn:hover { border-color: var(--accent) }
.bigbtn.go { background: var(--accent); border-color: var(--accent); color: var(--accent-fg) }

.cat { display: grid; grid-template-columns: 92px 1fr; gap: 6px; align-items: start; padding: 5px 0; border-top: 1px dashed var(--line) }

.slots { display: flex; flex-wrap: wrap; gap: 4px; min-width: 0 }

.pool { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px }
@media (max-width: 480px) { .pool { grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)) } }
.tile { position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 6px 8px; border-radius: 9px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); text-align: center; font-weight: 500; font-size: 12px; line-height: 1.2; min-height: 104px; font-family: var(--body) }
.tile .pic { width: 52px; height: 52px; object-fit: contain }
.tile .hs { font-size: 10px; color: var(--muted); font-family: var(--mono) }
.tile .herotag { position: absolute; top: 4px; left: 4px; width: 22px; height: 22px; border-radius: 5px; object-fit: cover }
.tile.sel { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent) }
.tile.takenA { background: var(--a-soft); border-color: var(--a) }
.tile.takenB { background: var(--b-soft); border-color: var(--b) }
.tile.takenA .pic, .tile.takenB .pic { filter: grayscale(.85); opacity: .55 }
.tile.blocked:not(.takenA):not(.takenB) { opacity: .4 }
.tile .own { position: absolute; top: 4px; right: 5px; font-size: 11px; font-weight: 800 }
.sectionlab { grid-column: 1 / -1; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-top: 6px; font-weight: 600 }
.lockbar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--panel); border-top: 1px solid var(--line); padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap; z-index: 5 }
.dock { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); width: min(720px, calc(100% - 24px)); background: var(--panel); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 8px 30px rgba(0,0,0,.25); padding: 10px 14px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; z-index: 6 }
.dock .dclock { font-family: var(--mono); font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; min-width: 64px }
.dock .dclock.low { color: var(--bad) }
.dock .dwho { font-family: var(--display); font-weight: 800; font-size: 17px; line-height: 1.15 }
.dock .dsub { font-size: 12px; color: var(--muted) }
.dock.mine { border: 2px solid var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 25%, transparent), 0 8px 30px rgba(0,0,0,.25) }
@media (prefers-reduced-motion: no-preference) { .dock.mine { animation: pulse 1.6s ease-in-out infinite } @keyframes pulse { 50% { box-shadow: 0 0 0 9px color-mix(in srgb, var(--accent) 10%, transparent), 0 8px 30px rgba(0,0,0,.25) } } }
body.hasdock .wrap { padding-bottom: 120px }
.rules { font-size: 14px; line-height: 1.5 }
.rules ol { margin: 6px 0 0; padding-left: 20px } .rules li { margin: 3px 0 }
.rules summary, details > summary { cursor: pointer }
.lacks { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; margin-top: 8px }
.lacks .hg { border: 1px solid var(--line); border-radius: 9px; padding: 6px 8px }
.lacks .hg > div { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; margin-bottom: 4px }
.lacks .hg img { width: 22px; height: 22px; border-radius: 5px }
.lacks label { display: flex; align-items: center; gap: 6px; font-size: 13px; padding: 2px 0 }
.lacks label img { width: 24px; height: 24px; object-fit: contain }
.army { background: linear-gradient(#3b4a6b, #2a3550); color: #fff; border-radius: 14px; padding: 12px; margin-bottom: 12px }
.army h3 { color: #fff; margin: 0 }
.army .tabs { display: flex; gap: 6px; margin-bottom: 10px }
.army .tabs button { background: rgba(255,255,255,.12); color: #fff; border-color: transparent }
.army .tabs button.on { background: #f5c542; color: #2a2a2a }
.capbar { display: flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 13px; margin: 8px 0 4px }
.capbar .bar { flex: 1; height: 8px; background: rgba(255,255,255,.15); border-radius: 99px; overflow: hidden }
.capbar .bar i { display: block; height: 100%; background: #f5c542 }
.capbar.full .bar i { background: #7bd66b }
.tray { display: flex; gap: 6px; flex-wrap: wrap; min-height: 74px; padding: 6px; background: rgba(0,0,0,.2); border-radius: 10px }
.tray .empty { color: rgba(255,255,255,.55); font-size: 13px; align-self: center; padding: 0 6px }
.unit { position: relative; width: 70px; height: 70px; border-radius: 10px; border: 2px solid rgba(255,255,255,.25); background: #5b6f99; padding: 0; overflow: hidden; cursor: pointer }
.unit img { width: 100%; height: 100%; object-fit: contain }
.unit .cnt { position: absolute; top: 2px; left: 4px; font-family: var(--display); font-weight: 800; font-size: 15px; color: #fff; text-shadow: 0 1px 2px #000, 0 0 2px #000 }
.unit .sp { position: absolute; bottom: 2px; right: 4px; font-size: 11px; font-weight: 700; color: #fff; text-shadow: 0 1px 2px #000 }
.unit.spell { background: #7a5ea8 } .unit.siege { background: #8a6b45 }
.unit:disabled { filter: grayscale(1); opacity: .35; cursor: not-allowed }
.unit:not(:disabled):hover { border-color: #f5c542 }
.train { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px }
.army .lab { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; opacity: .75; margin-top: 12px }
.hslots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px }
.hslot { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 4px; border-radius: 12px; border: 2px solid var(--line); background: var(--panel2); min-height: 132px; justify-content: center }
.hslot.on { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent) }
.hslot .hb { width: 64px; height: 64px; border-radius: 10px; object-fit: cover }
.hslot .plus { font-size: 34px; color: var(--muted); line-height: 1 }
.hslot .hn2 { font-size: 12px; font-weight: 600; text-align: center; line-height: 1.15 }
.hslot .gear { display: flex; gap: 3px; min-height: 26px }
.hslot .gear img, .hslot .gear span { width: 26px; height: 26px; border-radius: 6px; object-fit: contain; background: var(--panel) }
.hslot .gear span { border: 1px dashed var(--line); display: inline-block }
.herogrid { display: grid; grid-template-columns: repeat(2, 96px); gap: 8px; margin-top: 8px }
.herogrid .ico { width: 96px } .herogrid .ico img { width: 64px; height: 64px }
.hpanel { margin-top: 10px; padding: 10px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel) }
.icogrid { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 10px }
.ico { position: relative; width: 64px; padding: 4px 2px; display: flex; flex-direction: column; align-items: center; gap: 2px; border-radius: 10px; border: 2px solid var(--line); background: var(--panel2); font-size: 10px; font-weight: 600; line-height: 1.1; text-align: center }
.ico img { width: 44px; height: 44px; object-fit: contain }
.ico.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 15%, var(--panel2)) }
.ico.epic::after { content: "EPIC"; position: absolute; top: 2px; right: 3px; font-size: 8px; color: #a050e0 }
.ico:disabled { opacity: .35; cursor: not-allowed }
.unit.fixed { cursor: default }
.ctrs { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 6px }
.ctr { display: flex; align-items: center; gap: 6px; padding: 4px 6px; border: 1px solid var(--line); border-radius: 9px; background: var(--panel) }
.ctr.on { border-color: var(--accent) }
.ctr img { width: 34px; height: 34px; object-fit: contain }
.ctr .nm { flex: 1; min-width: 0; font-size: 13px; line-height: 1.2 } .ctr .nm small { display: block; color: var(--muted); font-size: 11px }
.ctr input { width: 48px; text-align: center; padding: 4px }
.ctr button { padding: 2px 9px; font-size: 16px; line-height: 1.2 }
.herorow { display: grid; grid-template-columns: 170px 1fr 1fr 1fr; gap: 8px; align-items: center; padding: 6px 0; border-top: 1px dashed var(--line) }
.herorow:first-of-type { border-top: 0 }
@media (max-width: 640px) { .herorow { grid-template-columns: 1fr 1fr } }
.herorow .hn { display: flex; align-items: center; gap: 6px; font-weight: 600; font-size: 14px }
.herorow .hn img { width: 30px; height: 30px; border-radius: 6px }
.herorow select { width: 100%; min-width: 0 }
.meter { font-family: var(--mono); font-size: 13px } .meter.over { color: var(--bad); font-weight: 700 }
.linkbox { width: 100%; font-family: var(--mono); font-size: 12px }
.log { max-height: 260px; overflow: auto; font-size: 12px }
.log div { padding: 3px 0; border-bottom: 1px solid var(--line) }
.note { font-size: 12px; padding: 8px 10px; border-radius: 8px; background: var(--panel2); color: var(--muted) }
.err { color: var(--bad); font-size: 13px }
.toast { position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: 8px; z-index: 20; font-weight: 600; max-width: calc(100% - 32px) }
.win { font-family: var(--display); font-size: 22px; font-weight: 800 }
.heroes { display: flex; gap: 6px; flex-wrap: wrap }
.heroes img { width: 30px; height: 30px; border-radius: 6px }
@media (prefers-reduced-motion: no-preference) { .tile { transition: transform .08s } .tile:active { transform: scale(.97) } }
</style>

<div class="wrap">
  <header class="top">
    <h1><a href="#">Megadraft</a></h1>
    <span id="mode" class="mode">Connecting…</span>
  </header>
  <main id="app"><p class="muted">Loading…</p></main>
</div>
<div id="lockbar" class="dock" hidden></div>
<div id="toast" class="toast" hidden></div>

<script>
const DATA = /*__DATA__*/{};
const ITEMS = DATA.items, HEROES = DATA.heroes, COMMONS = DATA.commons || [], PETS = DATA.pets || [];
const BYID = Object.fromEntries(ITEMS.map(i => [i.id, i]));
const CATS = [
  { k: "troop", label: "Troops" }, { k: "super", label: "Super troops" },
  { k: "spell", label: "Spells" }, { k: "siege", label: "Siege machines" }, { k: "epic", label: "Epic equipment" }];
const TH_LEVELS = [12, 13, 14, 15, 16, 17, 18];
const EPICS_PER_HERO = 2;
const DEFAULT_SETTINGS = { troops: 7, supers: 2, spells: 4, sieges: 1, epics: 4, timer: 20 };
const EPICS = ITEMS.filter(i => i.c === "epic");
const EQUIP = Object.fromEntries([...EPICS, ...COMMONS].map(e => [e.id, e]));
const PETBY = Object.fromEntries(PETS.map(p => [p.id, p]));
// Army capacity by Town Hall. These are estimates you can change in the builder.
// Max capacity per Town Hall: [army camps, spells, Clan Castle troops, Clan Castle spells, Clan Castle siege machines].
// TH18 from Mikhail; TH12-17 researched on coc.guide, cocmap and clasher.us (2026-11). The army itself always takes 1 siege machine.
const CAP = { 12: [280, 11, 40, 2, 1], 13: [300, 11, 45, 2, 1], 14: [300, 11, 45, 3, 1], 15: [320, 11, 50, 3, 1], 16: [320, 11, 50, 3, 2], 17: [340, 11, 55, 3, 2], 18: [352, 11, 55, 4, 2] };
// Pool follows the picks: about 1.5x what both players draft (at least 2 spare), 1.25x for epics.
// With the defaults (7 troops, 2 supers, 4 spells, 1 siege, 4 epics) that is 15 / 6 / 12 / 4 / 10.
const want = (n, f = 1.5) => n ? Math.max(Math.ceil(f * n), n + 2) : 0;
function autoSize(th, s) {
  const sup = want(2 * s.supers), all = want(2 * s.troops);
  const v = { troop: Math.max(0, all - sup), super: sup, spell: want(2 * s.spells), siege: want(2 * s.sieges), epic: want(2 * s.epics, 1.25) };
  for (const k in v) v[k] = Math.min(v[k], ITEMS.filter(i => i.c === k && i.th <= th).length);
  return v;
}
const MAX_REROLLS = 2;

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const img = (it, cls = "pic") => `<img class="${cls}" src="${it.img}" alt="" loading="lazy" decoding="async">`;
const other = s => s === "A" ? "B" : "A";
const now = () => Date.now();
const CLIENT = Math.random().toString(36).slice(2);
function ls(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v) } catch (e) { return null } }

/* ---------- rules (pure) ---------- */
const perPlayer = st => st.troops + st.spells + st.sieges + st.epics;
const totalPicks = r => 2 * perPlayer(r.settings);
const seqSeat = (r, k) => { const F = r.first, O = other(F); if (k === 0) return F; return Math.floor((k - 1) / 2) % 2 === 0 ? O : F };
const picksOf = (r, seat) => r.picks.filter(p => p.seat === seat).map(p => BYID[p.id]).filter(Boolean);
function counts(r, seat) {
  const c = { troop: 0, super: 0, spell: 0, siege: 0, epic: 0, hero: {} };
  for (const it of picksOf(r, seat)) { c[it.c]++; if (it.c === "epic") c.hero[it.h] = (c.hero[it.h] || 0) + 1 }
  return c;
}
// A seat is out of the draft once it has every pick or chose to finish early. Its remaining turns are skipped.
const seatFull = (r, s) => !!(r.done && r.done[s]) || picksOf(r, s).length >= perPlayer(r.settings);
function curSlot(r) { const N = totalPicks(r); let k = r.turn ?? r.picks.length; while (k < N && seatFull(r, seqSeat(r, k))) k++; return k }
function turnSeat(r) { const k = curSlot(r); return k < totalPicks(r) ? seqSeat(r, k) : null }

const minsOf = st => st.min || { troops: Math.max(0, st.troops - 2), spells: Math.max(0, st.spells - 1), epics: Math.max(0, st.epics - 2), sieges: st.sieges };

// Used when a seat has nothing legal left to pick, for example every remaining epic is one it doesn't own.

}
function whyIllegal(r, seat, it) {
  if (!r.pool.includes(it.id)) return "Not in this room's pool";
  if (it.c === "epic" && r.players[seat]?.lacks?.includes(it.id)) return `${r.players[seat].name} doesn't own ${it.n}`;
  if (r.picks.some(p => p.id === it.id)) return "Already taken";
  const s = r.settings, c = counts(r, seat);
  if (it.c === "troop" || it.c === "super") {
    if (c.troop + c.super >= s.troops) return `Troop slots full (${s.troops})`;
    if (it.c === "super" && c.super >= s.supers) return `Super troop limit reached (${s.supers})`;
  }
  if (it.c === "spell" && c.spell >= s.spells) return `Spell slots full (${s.spells})`;
  if (it.c === "siege" && c.siege >= s.sieges) return `Siege slot full (${s.sieges})`;
  if (it.c === "epic") {
    if (c.epic >= s.epics) return `Equipment slots full (${s.epics})`;

const legalItems = (r, seat) => r.pool.map(id => BYID[id]).filter(it => it && !whyIllegal(r, seat, it));

  r.turn = k + 1; r.turnStart = now();

}
function winner(r) {
  const a = r.results?.A, b = r.results?.B; if (!a || !b) return null;
  for (const k of ["stars", "pct", "time"]) { if (+a[k] > +b[k]) return "A"; if (+b[k] > +a[k]) return "B" }
  return "tie";
}
function shuffle(arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1));[a[i], a[j]] = [a[j], a[i]] } return a }
const eligible = (th, c) => ITEMS.filter(i => i.c === c && i.th <= th);
// Deal a limited random pool so armies have to overlap. Troops always include some air and some ground.
// Epics come only from ones at least one seated player owns, topped up so each player can fill their epic picks.
function genPool(th, size, players) {
  const out = [];
  const lacks = [players?.A, players?.B].filter(p => p && !p.bot).map(p => p.lacks || []);
  for (const c of ["troop", "super", "spell", "siege", "epic"]) {
    let el = shuffle(eligible(th, c));
    // epics: only ones every player owns; if fewer than the pool size, all of them
    if (c === "epic") el = el.filter(i => !lacks.some(l => l.includes(i.id)));
    const n = Math.min(size[c], el.length);
    if (c === "troop") {
      const air = el.filter(i => i.fly), ground = el.filter(i => !i.fly);
      const pick = [...air.slice(0, Math.min(3, Math.ceil(n / 4))), ...ground.slice(0, Math.min(5, Math.ceil(n / 2)))];
      const rest = el.filter(i => !pick.includes(i));
      out.push(...[...pick, ...rest].slice(0, n).map(i => i.id));

// Both players ready: deal the pool now that we know what everyone owns, flip for first pick, start.
function startDraft(x) {

}

  if (have("troop") + Math.min(have("super"), 2 * st.supers) < 2 * st.troops) return `The pool needs at least ${2 * st.troops} troops counting up to ${2 * st.supers} supers, so both players can fill ${st.troops} slots.`;
  if (have("spell") < 2 * st.spells) return `The pool needs at least ${2 * st.spells} spells.`;
  if (have("siege") < 2 * st.sieges) return `The pool needs at least ${2 * st.sieges} siege machines.`;

/* ---------- store: live shared rooms, or this device only ---------- */
const FIREBASE_SDK = "11.0.2";
const ROOM_MAX_AGE = 24 * 3600 * 1000; // lists hide rooms older than a day
const Store = {
  live: false, backend: "local", db: null, fb: null, uid: null, isOwner: false, rooms: {}, listeners: [], loaded: false,
  emit() { this.listeners.forEach(f => f()) },
  async init() {
    try {
      if (window.claude?.use) {
        const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
        if (db) { this.db = db; this.live = true; this.uid = user ? await user.id() : null; this.isOwner = user ? !!(await user.isOwner()) : false }
      }
    } catch (e) { this.live = false }
    if (this.live) this.backend = "claude";
    else if (window.MEGADRAFT_FIREBASE?.apiKey) {
      try { await this.initFirebase(window.MEGADRAFT_FIREBASE); return } catch (e) { console.error(e); toast("Couldn't connect to the room server. Using this device only.") }
    }
    if (!this.live) {
      try { this.rooms = JSON.parse(ls("megadraft-rooms") || "{}") } catch (e) { this.rooms = {} }
      this.uid = "local"; this.isOwner = true; this.loaded = true; this.emit(); return;
    }
    const t = setTimeout(() => { if (!this.loaded) toast("Can't reach the rooms yet. Retrying…") }, 10000);
    this.db.collection("rooms").onSnapshot(snap => {
      this.loaded = true; clearTimeout(t);
      const o = {}; snap.docs.forEach(d => { if (d.exists) o[d.id] = d.data() }); this.rooms = o; this.emit();
    }, () => toast("Rooms stopped updating. Reload the page."));
  },
  async initFirebase(cfg) {
    const base = `https://www.gstatic.com/firebasejs/${FIREBASE_SDK}/`;
    const [app, fs, au] = await Promise.all([import(base + "firebase-app.js"), import(base + "firebase-firestore.js"), import(base + "firebase-auth.js")]);
    const a = app.initializeApp(cfg);
    const db = fs.getFirestore(a), auth = au.getAuth(a);
    if (cfg.emulatorHost) { fs.connectFirestoreEmulator(db, cfg.emulatorHost, cfg.firestorePort || 8085); au.connectAuthEmulator(auth, `http://${cfg.emulatorHost}:${cfg.authPort || 9099}`, { disableWarnings: true }) }
    const cred = await au.signInAnonymously(auth);
    this.fb = { fs, db }; this.uid = cred.user.uid; this.live = true; this.backend = "firebase"; this.isOwner = false;
    const t = setTimeout(() => { if (!this.loaded) toast("Can't reach the rooms yet. Retrying…") }, 10000);
    fs.onSnapshot(fs.collection(db, "rooms"), snap => {
      this.loaded = true; clearTimeout(t);
      const o = {}; snap.forEach(d => { o[d.id] = d.data() }); this.rooms = o; this.emit();
    }, err => { console.error(err); toast("Rooms stopped updating. Reload the page.") });
  },
  persist() { if (!this.live) ls("megadraft-rooms", JSON.stringify(this.rooms)) },
  async create(r) {
    const id = "r" + now().toString(36) + Math.random().toString(36).slice(2, 5);
    if (!this.live) { this.rooms[id] = r; this.persist(); this.emit(); return id }
    if (this.backend === "firebase") { const { fs, db } = this.fb; await fs.setDoc(fs.doc(db, "rooms", id), r); return id }
    await this.db.doc("rooms/" + id).set(r); return id;
  },
  async remove(id) {
    if (!this.live) { delete this.rooms[id]; this.persist(); this.emit(); return }
    if (this.backend === "firebase") { const { fs, db } = this.fb; return fs.deleteDoc(fs.doc(db, "rooms", id)) }
    await this.db.doc("rooms/" + id).delete();
  },
  async mutate(id, fn) {
    if (!this.live) {
      const cur = this.rooms[id]; if (!cur) return false;
      const next = fn(structuredClone(cur)); if (!next) return false;
      this.rooms[id] = next; this.persist(); this.emit(); return true;
    }
    if (this.backend === "firebase") {
      // server-side transaction: two players can't both take the same pick
      const { fs, db } = this.fb, ref = fs.doc(db, "rooms", id);
      return fs.runTransaction(db, async tx => {
        const s = await tx.get(ref); if (!s.exists()) return false;
        const next = fn(structuredClone(s.data())); if (!next) return false;
        tx.set(ref, next); return true;
      });
    }
    const ref = this.db.doc("rooms/" + id);
    let got = false;
    for (let k = 0; k < 8 && !got; k++) {
      try { got = (await ref.acquire({ holder: CLIENT, ttlMs: 4000 })).acquired } catch (e) { break }
      if (!got) await new Promise(res => setTimeout(res, 250 + Math.random() * 250));
    }
    const snap = await ref.get(); if (!snap.exists) return false;
    const next = fn(structuredClone(snap.data())); if (!next) return false;
    await ref.set(next); return true;
  },
};

/* ---------- roles ---------- */
const mySeats = r => !Store.live ? ["A", "B"].filter(s => r.players[s] && !r.players[s].bot) : ["A", "B"].filter(s => Store.uid && r.players[s]?.uid === Store.uid);
const isHost = r => !Store.live || (Store.uid && r.hostUid === Store.uid);
const isMod = () => !Store.live || Store.isOwner;
const canActFor = (r, seat) => mySeats(r).includes(seat);

/* ---------- UI shell ---------- */
const ui = { tab: "all", sel: null, q: "", busy: false, thFilter: ls("megadraft-th") || "all" };
let toastT;
function toast(msg) { const t = document.getElementById("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2800) }
const app = document.getElementById("app");
function route() {
  const h = location.hash.slice(1);

  if (h === "create" || h === "join" || h === "builder") return { v: h };

let pendingRender = false;

  pendingRender = false;
  const openDetails = [...app.querySelectorAll("details[data-k]")].filter(d => d.open).map(d => d.dataset.k);

}

  if (r.v === "army") return renderBuilder(r);

}
app.addEventListener("focusout", () => setTimeout(() => { if (pendingRender) render() }, 0));

      ${w ? `<div class="win">${w === "tie" ? "Full tie: replay with a fresh draft." : `<span class="seat${w}">${esc(r.players[w].name)}</span> wins`}</div><div class="small muted">Stars first, then destruction %, then time left.</div>` : ""}
      <div class="row">${r.phase === "attack" && w && (isHost(r) || isMod() || mySeats(r).length) ? `<button type="button" class="primary" id="finish">Close room as finished</button>` : ""}
      ${(isHost(r) || isMod()) ? `<button type="button" id="rematch">Rematch with a new pool</button>` : ""}</div>
    </section>`;
}
function bindAttack(id, r) {
  app.querySelectorAll("[data-copy]").forEach(b => b.onclick = async () => {
    try { await navigator.clipboard.writeText(armyText(r, b.dataset.copy)); toast("Army copied.") } catch (e) { toast("Copy is blocked here. Select the roster text instead.") }
  });
  app.querySelectorAll("[data-res]").forEach(b => b.onclick = () => {
    const s = b.dataset.res, pe = document.getElementById(`r-${s}-pct`), te = document.getElementById(`r-${s}-time`);
    const stars = +document.getElementById(`r-${s}-stars`).value, pct = +pe.value, time = +te.value;
    if (pe.value === "" || te.value === "" || pct < 0 || pct > 100 || time < 0 || time > 180) { toast("Enter destruction 0–100 and seconds left 0–180."); return }
    Store.mutate(id, x => { x.results = x.results || {}; x.results[s] = { stars, pct, time }; return x });
  });
  const f = document.getElementById("finish"); if (f) f.onclick = () => Store.mutate(id, x => { x.phase = "done"; return x });
  const rm = document.getElementById("rematch");
  if (rm) rm.onclick = () => confirmInline(rm, "Same players, new pool?", async () => {
    const n = structuredClone(r);
    Object.assign(n, { name: r.name.replace(/ \(rematch\)$/, "") + " (rematch)", createdAt: now(), phase: "lobby", first: null, turn: 0, done: {}, pool: [], picks: [], turnStart: null, paused: false, pausedLeft: null, rerolls: 0, reroll: null, results: { A: null, B: null } });
    for (const s of ["A", "B"]) if (n.players[s] && !n.players[s].bot) n.players[s].ready = false;
    const nid = await Store.create(n); location.hash = "r-" + nid;
  });
}

/* ---------- army builder ---------- */
// In-game "copy army" link. Sections: h heroes, i CC troops, d CC spells, u troops (siege included), s spells.
function armyLink(a) {
  const sec = [];
  const hs = a.heroes.filter(h => h && h.h && HEROES[h.h]).map(h => {
    let s = "" + HEROES[h.h].aid;
    if (h.pet && PETBY[h.pet]) s += "p" + PETBY[h.pet].aid;
    const e = (h.eq || []).filter(id => EQUIP[id]).map(id => EQUIP[id].aid);
    if (e.length) s += "e" + e.join("_");
    return s;
  });
  if (hs.length) sec.push("h" + hs.join("-"));
  const part = (k, o) => { const e = Object.entries(o || {}).filter(([id, n]) => n > 0 && BYID[id]).map(([id, n]) => `${n}x${BYID[id].aid}`); if (e.length) sec.push(k + e.join("-")) };
  part("i", a.cc.u); part("d", a.cc.s); part("u", a.u); part("s", a.s);
  return "https://link.clashofclans.com/en?action=CopyArmy&army=" + sec.join("");
}
const space = (o, siege) => Object.entries(o || {}).reduce((t, [id, n]) => { const it = BYID[id]; if (!it || (it.c === "siege") !== !!siege) return t; return t + n * (siege ? 1 : it.hs || 0) }, 0);
function renderBuilder(ctx) {
  let r = null, seat = null, th, troops, spells, sieges, epicIds, key, title, back;
  if (ctx) {
    r = Store.rooms[ctx.id];
    if (!r) { app.innerHTML = Store.loaded ? `<div class="note">This room no longer exists. <a href="#builder">Open the free army builder</a>.</div>` : `<p class="muted">Loading room…</p>`; return }
    seat = ctx.seat; th = r.th;
    const mine = picksOf(r, seat);
    troops = mine.filter(i => i.c === "troop" || i.c === "super"); spells = mine.filter(i => i.c === "spell"); sieges = mine.filter(i => i.c === "siege");
    epicIds = mine.filter(i => i.c === "epic").map(i => i.id);
    key = `megadraft-army-${ctx.id}-${seat}`; title = `${esc(r.players[seat]?.name)}'s army`; back = `#r-${ctx.id}`;
  } else {
    th = +(ls("megadraft-bth") || 18);
    troops = ITEMS.filter(i => (i.c === "troop" || i.c === "super") && i.th <= th); spells = eligible(th, "spell"); sieges = eligible(th, "siege");
    epicIds = EPICS.filter(e => !myLacks().includes(e.id)).map(e => e.id);
    key = `megadraft-army-th${th}`; title = "Army builder"; back = "#";
  }
  const cap = CAP[th] || CAP[18];
  let a; try { a = JSON.parse(ls(key) || "null") } catch (e) { a = null }
  const heroList = Object.entries(HEROES).filter(([, h]) => h.th <= th).map(([k]) => k);
  if (!a) a = { u: {}, s: {}, cc: { u: {}, s: {} }, heroes: heroList.slice(0, 4).map(h => ({ h, pet: "", eq: ["", ""] })) };
  // 4 fixed hero slots (null = empty)
  a.heroes = [0, 1, 2, 3].map(i => { const h = a.heroes[i]; return h && h.h && heroList.includes(h.h) ? h : null });
  // siege machines never go in the army; in a room the drafted one sits in the Clan Castle automatically
  for (const id of Object.keys(a.u)) if (BYID[id]?.c === "siege") delete a.u[id];
  if (ctx) { for (const id of Object.keys(a.cc.u)) if (BYID[id]?.c === "siege") delete a.cc.u[id]; sieges.slice(0, cap[4]).forEach(s => a.cc.u[s.id] = 1) }
  const tab = ui.btab || "army";
  const save = () => { ls(key, JSON.stringify(a)); renderBuilder(ctx) };
  // buckets: army troops+siege (u), army spells (s), CC troops+siege (cu), CC spells (cs)
  const get = b => b === "u" ? a.u : b === "s" ? a.s : b === "cu" ? a.cc.u : a.cc.s;
  const room = { u: cap[0] - space(a.u), s: cap[1] - space(a.s), cu: cap[2] - space(a.cc.u), cs: cap[3] - space(a.cc.s), gu: 1 - space(a.u, true), gcu: cap[4] - space(a.cc.u, true) };
  const fits = (b, it) => it.c === "siege" ? room["g" + b] >= 1 : room[b] >= (it.hs || 1);
  const kind = it => it.c === "spell" ? "spell" : it.c === "siege" ? "siege" : "";
  const fixed = it => ctx && it.c === "siege";
  const unit = (b, it, n, add) => !add && fixed(it) ? `<span class="unit siege fixed" title="${esc(it.n)} · your drafted siege machine, always in the Clan Castle">${img(it, "")}<span class="cnt">x${n}</span></span>`
    : `<button type="button" class="unit ${kind(it)}" data-${add ? "add" : "rem"}="${b}|${it.id}" ${add && !fits(b, it) ? "disabled" : ""} title="${esc(it.n)}${add ? "" : " · tap to remove one"}">${img(it, "")}${n ? `<span class="cnt">x${n}</span>` : ""}${add && it.c !== "siege" ? `<span class="sp">${it.hs || 1}</span>` : ""}</button>`;
  const tray = (bs) => { const out = bs.flatMap(b => Object.entries(get(b)).filter(([id, n]) => n > 0 && BYID[id]).map(([id, n]) => unit(b, BYID[id], n, false))); return out.length ? out.join("") : `<span class="empty">Tap a unit below to add it.</span>` };
  const capbar = (lab, used, max) => `<div class="capbar ${used >= max ? "full" : ""}"><span style="min-width:92px">${lab}</span><span class="bar"><i style="width:${max ? Math.min(100, 100 * used / max) : 0}%"></i></span><span>${used}/${max}</span></div>`;
  const cc = tab === "cc", tb = cc ? "cu" : "u", sb = cc ? "cs" : "s";
  const usedT = cc ? space(a.cc.u) : space(a.u), usedS = cc ? space(a.cc.s) : space(a.s), usedG = cc ? space(a.cc.u, true) : space(a.u, true);
  // hero slots: tap an empty slot to pick a hero; tap a filled one for pet, equipment or a different hero
  const hs = ui.hslot ?? -1, cur = a.heroes[hs];
  const usedPets = a.heroes.filter((h, i) => h && i !== hs).map(h => h.pet).filter(Boolean);
  const slot = (h, i) => {
    if (!h) return `<button type="button" class="hslot ${hs === i ? "on" : ""}" data-hslot="${i}"><span class="plus">+</span><span class="hn2 muted">Add hero</span></button>`;
    const H = HEROES[h.h], pet = PETBY[h.pet];
    return `<button type="button" class="hslot ${hs === i ? "on" : ""}" data-hslot="${i}"><img class="hb" src="${H.img}" alt=""><span class="hn2">${esc(H.n)}</span>
      <span class="gear">${pet ? `<img src="${pet.img}" alt="" title="${esc(pet.n)}">` : `<span title="No pet"></span>`}${[0, 1].map(k => EQUIP[h.eq[k]] ? `<img src="${EQUIP[h.eq[k]].img}" alt="" title="${esc(EQUIP[h.eq[k]].n)}">` : `<span title="No equipment"></span>`).join("")}</span></button>`;
  };
  let panel = "";
  if (hs >= 0) {
    const taken = a.heroes.filter((h, i) => h && i !== hs).map(h => h.h);
    const heroBtn = k => `<button type="button" class="ico ${cur?.h === k ? "on" : ""}" data-pickhero="${k}" ${taken.includes(k) ? "disabled title=\"Already in another slot\"" : ""}><img src="${HEROES[k].img}" alt="">${esc(HEROES[k].n)}</button>`;
    if (!cur) {
      panel = `<div class="hpanel"><div class="row"><b>Choose a hero</b><span class="spacer"></span><button type="button" id="h-close">Close</button></div><div class="herogrid">${heroList.map(heroBtn).join("")}</div></div>`;
    } else {
      const eqs = [...COMMONS.filter(c => c.h === cur.h && c.th <= th), ...epicIds.map(id => EQUIP[id]).filter(e => e && e.h === cur.h)];
      const pets = PETS.filter(p => p.th <= th);
      panel = `<div class="hpanel">
        <div class="row"><b>${esc(HEROES[cur.h].n)}</b><span class="spacer"></span><button type="button" id="h-remove">Remove</button><button type="button" class="primary" id="h-close">Done</button></div>
        <div class="lab" style="margin-top:10px">Hero · tap another to swap</div>
        <div class="icogrid">${heroList.filter(k => !taken.includes(k)).map(heroBtn).join("")}</div>
        <div class="lab" style="margin-top:10px">Equipment · pick 2 (${cur.eq.filter(Boolean).length}/2)</div>
        <div class="icogrid">${eqs.map(e => { const on = cur.eq.includes(e.id); return `<button type="button" class="ico ${on ? "on" : ""} ${BYID[e.id] ? "epic" : ""}" data-pickeq="${e.id}" ${!on && cur.eq.filter(Boolean).length >= 2 ? "disabled" : ""}><img src="${e.img}" alt="">${esc(e.n)}</button>` }).join("")}</div>
        <div class="lab">Pet</div>
        <div class="icogrid"><button type="button" class="ico ${!cur.pet ? "on" : ""}" data-pickpet=""><span style="width:44px;height:44px;display:grid;place-items:center;font-size:22px">∅</span>No pet</button>${pets.map(pt => `<button type="button" class="ico ${cur.pet === pt.id ? "on" : ""}" data-pickpet="${pt.id}" ${usedPets.includes(pt.id) ? "disabled title=\"Used by another hero\"" : ""}><img src="${pt.img}" alt="">${esc(pt.n)}</button>`).join("")}</div>
      </div>`;
    }
  }
  const link = armyLink(a);
  const empty = !Object.values(a.u).some(n => n > 0) && !Object.values(a.s).some(n => n > 0);
  const ttl = ctx ? `<span class="th">TH${th}</span><h2 style="margin:0">${title}</h2><span class="muted small">${esc(r.name)}</span>`
    : `<h2 style="margin:0">${title}</h2><label class="f" style="width:120px">Town Hall<select id="b-th">${TH_LEVELS.map(x => `<option ${x === th ? "selected" : ""}>${x}</option>`).join("")}</select></label>`;
  app.innerHTML = `<div id="builder">
    <div class="row" style="margin-bottom:8px"><a href="${back}" class="small muted">← Back</a></div>
    <div class="row" style="margin-bottom:12px">${ttl}</div>
    <section class="army">
      <div class="tabs"><button type="button" data-btab="army" class="${cc ? "" : "on"}">Army</button><button type="button" data-btab="cc" class="${cc ? "on" : ""}">Clan Castle</button><span class="spacer"></span><button type="button" id="b-clear">Clear ${cc ? "Clan Castle" : "army"}</button></div>
      ${capbar(cc ? "CC troops" : "Troops", usedT, cc ? cap[2] : cap[0])}
      <div class="tray">${tray([tb])}</div>
      ${capbar(cc ? "CC spells" : "Spells", usedS, cc ? cap[3] : cap[1])}
      <div class="tray">${tray([sb])}</div>
      <div class="lab">Troops${ctx ? " you drafted" : ""}</div>
      <div class="train">${troops.filter(i => i.c === "troop").map(it => unit(tb, it, 0, true)).join("") || `<span class="empty">None drafted.</span>`}</div>
      ${troops.some(i => i.c === "super") ? `<div class="lab">Super troops</div><div class="train">${troops.filter(i => i.c === "super").map(it => unit(tb, it, 0, true)).join("")}</div>` : ""}
      ${cc ? (ctx ? (sieges.length ? `<div class="lab">Siege machine · added automatically</div>` : "") : `<div class="lab">Siege machines · ${usedG}/${cap[4]}</div><div class="train">${sieges.map(it => unit("cu", it, 0, true)).join("")}</div>`)
        : `<div class="lab">Siege machine · goes in the Clan Castle</div>`}
      <div class="lab">Spells${ctx ? " you drafted" : ""}</div>
      <div class="train">${spells.map(it => unit(sb, it, 0, true)).join("") || `<span class="empty">None drafted.</span>`}</div>
    </section>
    <section class="panel" style="margin-bottom:12px"><h3>Heroes <span class="muted small">· tap a slot</span></h3><div class="hslots">${a.heroes.map(slot).join("")}</div>${panel}</section>
    <section class="panel stack" style="margin-bottom:12px">
      <b>In-game link</b>
      <input class="linkbox" id="b-link" readonly value="${esc(link)}" aria-label="Army link">
      <div class="row"><button type="button" class="primary" id="b-copy" ${empty ? "disabled" : ""}>Copy link</button><a class="btn" href="${esc(link)}" target="_blank" rel="noopener" ${empty ? `aria-disabled="true" style="pointer-events:none;opacity:.45"` : ""}>Open in Clash of Clans</a>
        <span class="small muted">Open the link on the phone that has the game, then tap Okay to copy the army.</span></div>
    </section>
  </div>`;
  app.querySelectorAll("[data-add]").forEach(b => b.onclick = () => { const [bk, id] = b.dataset.add.split("|"), it = BYID[id]; if (!fits(bk, it)) return; const o = get(bk); o[id] = (o[id] || 0) + 1; save() });
  app.querySelectorAll("[data-rem]").forEach(b => b.onclick = () => { const [bk, id] = b.dataset.rem.split("|"), o = get(bk); o[id] = (o[id] || 0) - 1; if (o[id] <= 0) delete o[id]; save() });
  app.querySelectorAll("[data-btab]").forEach(b => b.onclick = () => { ui.btab = b.dataset.btab; renderBuilder(ctx) });
  app.querySelectorAll("[data-hslot]").forEach(b => b.onclick = () => { const i = +b.dataset.hslot; ui.hslot = ui.hslot === i ? -1 : i; ui.hpick = false; renderBuilder(ctx) });
  app.querySelectorAll("[data-pickhero]").forEach(b => b.onclick = () => { const k = b.dataset.pickhero; if (a.heroes[hs]?.h !== k) a.heroes[hs] = { h: k, pet: a.heroes[hs]?.pet || "", eq: ["", ""] }; ui.hpick = false; save() });
  app.querySelectorAll("[data-pickeq]").forEach(b => b.onclick = () => { const id = b.dataset.pickeq, eq = cur.eq; const k = eq.indexOf(id); if (k >= 0) eq[k] = ""; else { const f = eq.indexOf(""); if (f >= 0) eq[f] = id } save() });
  app.querySelectorAll("[data-pickpet]").forEach(b => b.onclick = () => { cur.pet = b.dataset.pickpet; save() });
  const hr = document.getElementById("h-remove"); if (hr) hr.onclick = () => { a.heroes[hs] = null; ui.hslot = -1; save() };
  const hx = document.getElementById("h-close"); if (hx) hx.onclick = () => { ui.hslot = -1; ui.hpick = false; renderBuilder(ctx) };
  document.getElementById("b-clear").onclick = () => { if (cc) a.cc = { u: {}, s: {} }; else { a.u = {}; a.s = {} } save() };  // drafted siege comes back on save
  document.getElementById("b-copy").onclick = async () => { try { await navigator.clipboard.writeText(link); toast("Link copied.") } catch (e) { const l = document.getElementById("b-link"); l.select(); toast("Copy is blocked here. The link is selected, copy it by hand.") } };
  const bth = document.getElementById("b-th"); if (bth) bth.onchange = () => { ls("megadraft-bth", bth.value); renderBuilder(null) };
}

/* ---------- practice bot ---------- */
// Fills its emptiest category first, prefers bigger troops, and sometimes takes what the other player could still use.
function botChoice(r, legal) {
  const seat = turnSeat(r), st = r.settings, c = counts(r, seat);
  const need = { troop: st.troops - c.troop - c.super, spell: st.spells - c.spell, siege: st.sieges - c.siege, epic: st.epics - c.epic };
  const score = it => {
    const cat = it.c === "super" ? "troop" : it.c;
    let s = need[cat] * 10 + Math.random() * 12;
    if (it.hs) s += Math.min(it.hs, 30) / 6;
    if (it.c === "super") s += 3;
    return s;
  };
  return legal.slice().sort((a, b) => score(b) - score(a))[0];
}

/* ---------- timer + auto-pick ---------- */
const autoTried = {};
function fmt(ms) { const s = Math.ceil(ms / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}` }
setInterval(() => {
  const rt = route(); if (rt.v !== "room") return;
  const r = Store.rooms[rt.id]; if (!r || r.phase !== "draft") return;
  if (r.settings.timer) document.querySelectorAll(".js-clock").forEach(c => {
    const big = c.classList.contains("dclock") ? "dclock" : "clock";
    if (r.paused) { c.textContent = "Paused " + fmt(r.pausedLeft ?? r.settings.timer * 1000); c.className = big + " js-clock" }
    else { const left = deadline(r) - now(); c.textContent = fmt(Math.max(0, left)); c.className = big + " js-clock" + (left < 6000 ? " low" : "") }
  });
  const i = r.picks.length, k = curSlot(r), seat = turnSeat(r); if (!seat) return;
  // practice bot: the host's device picks for it after a short pause
  if (r.players[seat]?.bot && isHost(r) && !r.paused && r.turnStart && now() - r.turnStart >= 1200) {
    const bk = rt.id + ":bot:" + i + ":" + k;
    if (!autoTried[bk]) {
      autoTried[bk] = true;
      Store.mutate(rt.id, x => {
        if (x.phase !== "draft" || x.picks.length !== i || curSlot(x) !== k || x.paused) return null;
        const legal = legalItems(x, turnSeat(x)); if (!legal.length) return finishStuck(x, turnSeat(x));
        return applyPick(x, botChoice(x, legal).id, false);
      }).catch(() => { autoTried[bk] = false });
    }
    return;
  }
  const d = deadline(r); if (!d) return;
  const late = now() - d;
  // the picker's own device auto-picks first; the opponent's device covers after 3 s, any viewer after 8 s
  const due = mySeats(r).includes(seat) ? late >= 0 : mySeats(r).length ? late >= 3000 : late >= 8000;
  const key = rt.id + ":" + i + ":" + k;
  if (!due || autoTried[key]) return;
  if (Store.live && !Store.uid) return;
  autoTried[key] = true;
  Store.mutate(rt.id, x => {
    if (x.phase !== "draft" || x.picks.length !== i || curSlot(x) !== k || x.paused) return null;
    const dl = deadline(x); if (!dl || now() < dl) return null;
    const legal = legalItems(x, turnSeat(x)); if (!legal.length) return finishStuck(x, turnSeat(x));
    return applyPick(x, legal[Math.floor(Math.random() * legal.length)].id, true);
  }).catch(() => { autoTried[key] = false });
}, 250);

Store.listeners.push(() => {
  const v = route().v;
  // these pages don't depend on live room changes, and a re-render would wipe what you typed
  if (v === "create" || v === "builder" || (v === "army" && document.getElementById("builder"))) return;
  render();
});
Store.init().then(() => render(true));
</script>
